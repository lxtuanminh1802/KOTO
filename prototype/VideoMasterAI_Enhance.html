    .btn-accent { @apply bg-accent text-accent-fg shadow-sm hover:brightness-110; }
    .btn-quiet { @apply bg-surface text-fg border border-line2/80 shadow-sm hover:bg-subtle; }
    .btn-ghost { @apply text-muted hover:text-fg hover:bg-subtle; }
    .btn-danger { @apply bg-danger text-white hover:brightness-110; }
    .icon-btn { @apply inline-flex items-center justify-center w-9 h-9 rounded-md text-muted hover:text-fg hover:bg-subtle transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent; }
    .icon-btn-sm { @apply inline-flex items-center justify-center w-8 h-8 rounded-md text-muted hover:text-fg hover:bg-subtle transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent; }
    .chip { @apply inline-flex items-center gap-1.5 h-8 px-3 rounded-full border border-line2/80 bg-surface text-[13px] text-muted hover:text-fg hover:border-line2 transition-colors select-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent; }
    .chip[aria-pressed="true"] { @apply bg-accent/10 text-accent border-accent/40 font-medium; }
    .panel { @apply bg-surface border border-line rounded-lg shadow-[0_1px_2px_rgba(16,24,40,.05)]; }
    .label { @apply text-xs font-semibold text-muted; }
    .inp { @apply w-full h-9 px-3 rounded-md bg-surface border border-line2/80 text-sm text-fg placeholder:text-muted focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition; }
    .tabs { @apply flex items-center gap-6 border-b border-line overflow-x-auto; }
    .tabs > button { @apply relative inline-flex items-center gap-2 h-10 text-sm text-muted hover:text-fg whitespace-nowrap transition-colors focus-visible:outline-none focus-visible:text-fg; }
    .tabs > button[aria-selected="true"] { @apply text-accent font-semibold; }
    .tabs > button[aria-selected="true"]::after { content: ''; @apply absolute left-0 right-0 -bottom-px h-0.5 bg-accent rounded-full; }
    .nav-tab { @apply inline-flex items-center gap-2 h-9 px-3 rounded-md text-sm text-muted hover:text-fg hover:bg-subtle transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent; }
    .nav-tab[aria-selected="true"] { @apply bg-accent/10 text-accent font-semibold; }
    .mnav { @apply flex flex-col items-center justify-center gap-1 text-2xs text-muted focus-visible:outline-none focus-visible:text-fg; }

    .mnav[aria-selected="true"] { @apply text-accent font-semibold; }

    .switch input { @apply sr-only; }
    .switch span { @apply absolute inset-0 rounded-full bg-line2 transition-colors; }
    .switch span::after { content: ''; @apply absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white shadow transition-transform; }
    .switch input:checked + span { @apply bg-accent; }
    .switch input:checked + span::after { @apply translate-x-4; }
    .switch input:focus-visible + span { @apply ring-2 ring-accent ring-offset-2 ring-offset-surface; }
    .tag { @apply inline-flex items-center gap-1 h-[18px] px-1.5 rounded-sm text-[11px] font-semibold leading-none shrink-0 whitespace-nowrap; }
    .tag-orig { @apply bg-subtle text-muted ring-1 ring-inset ring-line2; }
    .tag-clip { @apply bg-accent/10 text-accent; }
    .th { @apply px-4 h-10 text-left text-xs font-semibold text-muted bg-subtle/70 whitespace-nowrap; }
    .td { @apply px-4 py-3 align-middle; }

<style>
  html, body { height: 100%; }
  body { overflow: hidden; font-size: 14px; }
  body { font-family: 'Public Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: rgb(var(--bg)); color: rgb(var(--fg)); }
  .view-off { display: none !important; }

  /* Guidance: tooltip, tour spotlight */
  .tip { position: fixed; z-index: 90; max-width: 280px; padding: 6px 10px; border-radius: 6px; background: rgb(var(--inverse)); color: rgb(var(--inverse-fg));
    font: 500 12px/1.45 'Public Sans', sans-serif; box-shadow: 0 6px 20px rgba(16,24,40,.18); opacity: 0; transform: translateY(3px); transition: opacity .12s, transform .12s; pointer-events: none; }
  .tip.on { opacity: 1; transform: none; }
  #coach { position: fixed; z-index: 95; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(8,12,20,.55), 0 0 0 2px rgb(var(--accent)); pointer-events: none; transition: left .25s, top .25s, width .25s, height .25s; }
  #actorsO, #actorsE { filter: saturate(.4) contrast(.88) brightness(1.03) blur(.6px); }

  /* Inline SVG icons: sized by font-size like an icon font, coloured by currentColor */
  .ic { display: inline-block; width: 1em; height: 1em; flex-shrink: 0; vertical-align: -0.125em; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .ic-fill { fill: currentColor; stroke: none; }
  .tabular { font-variant-numeric: tabular-nums; }
  .drawer-open { transform: translateX(0) !important; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgb(var(--line2)); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
  .no-scrollbar { scrollbar-width: none; } .no-scrollbar::-webkit-scrollbar { display: none; }

  /* Detection boxes: neutral white outline so footage stays readable, accent only for focus */
  .det { position: absolute; border: 1px solid rgba(255,255,255,.88); border-radius: 1px; box-shadow: 0 0 0 1px rgba(0,0,0,.45); transition: left .12s linear; }
  .det-label { position: absolute; left: -1px; bottom: 100%; margin-bottom: 2px; white-space: nowrap; font: 500 10px/16px 'IBM Plex Mono', monospace; padding: 0 4px; border-radius: 1px; background: rgba(8,10,13,.78); color: #E8EAED; }
  .det-plate { border-style: dashed; }
  .det-focus { border-color: rgb(var(--accent)); border-width: 1.5px; }
  .det-focus .det-label { background: rgb(var(--accent)); color: rgb(var(--accent-fg)); }
  .det-click { cursor: pointer; pointer-events: auto; }
  .det-click:hover { border-color: rgb(var(--accent)); }
  .redact { position: absolute; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(120,120,120,.25); border-radius: 3px; }

  /* Compare divider */
  .split-handle { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); cursor: ew-resize; touch-action: none; }
  .split-handle::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 32px; height: 32px; border-radius: 999px; background: #fff url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2315171C%22%20stroke-width%3D%222.25%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m9%207-5%205%205%205%22/%3E%3Cpath%20d%3D%22m15%207%205%205-5%205%22/%3E%3C/svg%3E") center / 16px no-repeat; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .split-handle:focus-visible::after { box-shadow: 0 0 0 3px rgb(var(--accent)); }

  /* Colour swatches */
  .swatch { width: 28px; height: 28px; border-radius: 999px; position: relative; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); transition: transform .15s; }
  .dark .swatch { box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
  .swatch:hover { transform: scale(1.08); }
  .swatch:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; }
  .swatch[aria-pressed="true"]::after { content: ''; position: absolute; inset: 0; background: var(--ck,#15171C); -webkit-mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M20%206%209%2017l-5-5%22/%3E%3C/svg%3E") center / 13px no-repeat; mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M20%206%209%2017l-5-5%22/%3E%3C/svg%3E") center / 13px no-repeat; }

  /* Range */
  input[type=range].rng { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 999px; background: linear-gradient(90deg, rgb(var(--fg)) var(--p,50%), rgb(var(--line)) var(--p,50%)); outline: none; }
  input[type=range].rng::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: rgb(var(--surface)); border: 2px solid rgb(var(--fg)); cursor: pointer; }
  input[type=range].rng::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: rgb(var(--surface)); border: 2px solid rgb(var(--fg)); cursor: pointer; }
  input[type=range].rng:focus-visible { box-shadow: 0 0 0 3px rgb(var(--accent) / .35); }

  .plate { display: inline-block; background: #F4F4F0; color: #15171C; font: 600 14px/1 'IBM Plex Mono', monospace; border: 1.5px solid #15171C; border-radius: 4px; padding: 6px 8px; letter-spacing: .03em; }

  /* Map */
  .cam-pin { width: 16px; height: 16px; border-radius: 50%; background: rgb(var(--fg)); border: 3px solid rgb(var(--surface)); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .cam-pin.hit { background: rgb(var(--accent)); width: 20px; height: 20px; }
  .leaflet-container { background: rgb(var(--land)); font-family: inherit; }
  .map-water { fill: rgb(var(--water)); fill-opacity: 1; stroke: rgb(var(--water)); stroke-width: 1px; }
  .map-case { stroke: rgb(var(--line2)); stroke-width: 7px; fill: none; }
  .map-case.major { stroke-width: 11px; }
  .map-road { stroke: rgb(var(--surface)); stroke-width: 4.5px; fill: none; }
  .map-road.major { stroke-width: 8px; }
  .map-label span { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font: 500 11px/1 'Public Sans', sans-serif; color: rgb(var(--muted));
    text-shadow: 0 0 2px rgb(var(--land)), 0 0 4px rgb(var(--land)), 0 0 6px rgb(var(--land)); pointer-events: none; }
  .map-label.water span { font-style: italic; color: rgb(var(--accent)); }
  .leaflet-bar a { background: rgb(var(--surface)) !important; color: rgb(var(--fg)) !important; border-color: rgb(var(--line)) !important; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: rgb(var(--surface)); color: rgb(var(--fg)); box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  .leaflet-control-attribution { background: rgb(var(--surface) / .8) !important; color: rgb(var(--muted)) !important; }

  /* Motion that answers an action */
  .modal-in { animation: modalIn .2s cubic-bezier(.2,.8,.2,1); }
  @keyframes modalIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .fade-in { animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .typing span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: rgb(var(--muted)); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .shimmer { background: linear-gradient(90deg, rgb(var(--subtle)) 0%, rgb(var(--line)) 50%, rgb(var(--subtle)) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
<style>
  /* Suite additions: app accents, origin tags, spotlight */
  .app-name { color: var(--app); }
  .tag-ext { background: rgb(15 118 110 / .12); color: rgb(15 118 110); }
  .dark .tag-ext { background: rgb(45 212 191 / .15); color: rgb(94 234 212); }
  .tag-enh { background: rgb(124 58 237 / .12); color: rgb(109 40 217); }
  .dark .tag-enh { background: rgb(167 139 250 / .16); color: rgb(196 181 253); }
  .tag-warn { background: rgb(var(--warn) / .12); color: rgb(var(--warn)); }
  .tag-bad { background: rgb(var(--danger) / .12); color: rgb(var(--danger)); }
  .tag-ok { background: rgb(var(--ok) / .12); color: rgb(var(--ok)); }
  .spot { position: fixed; z-index: 96; border-radius: 10px; pointer-events: none; box-shadow: 0 0 0 3px rgb(var(--accent)), 0 0 0 9px rgb(var(--accent) / .25); animation: spotPulse 1.2s ease-in-out 2; }
  @keyframes spotPulse { 50% { box-shadow: 0 0 0 3px rgb(var(--accent)), 0 0 0 16px rgb(var(--accent) / 0); } }
  #helpBot { will-change: transform; }
  .seg { display: inline-flex; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 1px rgb(var(--line2) / .8); background: rgb(var(--surface)); }
  .seg > button { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; font-size: 12px; color: rgb(var(--muted)); }
  .seg > button:hover { color: rgb(var(--fg)); background: rgb(var(--subtle)); }
  .seg > button[aria-pressed="true"] { background: rgb(var(--accent) / .1); color: rgb(var(--accent)); font-weight: 600; }
  .seg > button:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: -2px; }
  canvas { image-rendering: auto; }
</style>

    const { hash, ...row } = log[i];

/* ---------- tooltips (HELP-03) ---------- */
let tipEl = null, tipFor = null;
function showTip(el) {
  const text = el.getAttribute('data-tip'); if (!text) return;
  tipEl ||= Object.assign(document.createElement('div'), { className:'tip', role:'tooltip', id:'vmaTip' }); document.body.append(tipEl);
  tipEl.textContent = text; tipFor = el; tipEl.classList.add('on');
  const r = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
  let top = r.bottom + 8; if (top + t.height > innerHeight - 8) top = r.top - t.height - 8;
  tipEl.style.left = clamp(r.left + r.width / 2 - t.width / 2, 8, innerWidth - t.width - 8) + 'px'; tipEl.style.top = top + 'px';
}
const hideTip = () => { tipEl?.classList.remove('on'); tipFor = null; };
if (!window.VMA_EMBED) {  // Analyse keeps the tooltips of its own page
  document.addEventListener('mouseover', e => { const el = e.target.closest?.('[data-tip]'); if (el && el !== tipFor) showTip(el); else if (!el && tipFor) hideTip(); });
  document.addEventListener('focusin', e => { const el = e.target.closest?.('[data-tip]'); el ? showTip(el) : hideTip(); });
  document.addEventListener('scroll', hideTip, true);
}

VMA.renderCase = () => {
  const c = VMA.db.active(), cfg = VMA.cfg, evs = VMA.db.evidenceOf(c.code);
  const steps = cfg.steps(c.code), cur = steps.findIndex(s => !s.done);
  const next = cfg.nextStep(c.code, cur);
  $('#caseView').innerHTML = `
    <div class="flex flex-wrap items-start gap-4 justify-between">
      <div class="min-w-0"><p class="text-xs font-mono text-muted">${c.code} · ${esc(c.decision)}</p><h1 class="text-xl font-bold mt-1" style="text-wrap:balance">${esc(c.title)}</h1>
        <p class="text-sm text-muted mt-1">Điều tra viên phụ trách ${esc(c.lead)} · mở ngày ${fmtDate(c.opened).slice(0, 10)} · <span class="text-ok font-medium">${esc(c.status)}</span></p></div>
      <div class="flex flex-wrap gap-2">${cfg.caseActions?.(c.code) || ''}</div>
    </div>
    <section class="panel p-5" aria-label="Tiến trình xử lý">
      <div class="flex items-center justify-between gap-3"><h2 class="text-sm font-bold">Tiến trình trong ${VMA.appById(cfg.app).name}</h2><span class="text-xs text-muted">${steps.filter(s => s.done).length}/${steps.length} bước</span></div>
      <ol class="mt-4 grid gap-3 sm:grid-cols-2 xl:grid-cols-${steps.length}">${steps.map((s, i) => `<li class="flex gap-3 items-start p-3 rounded-lg ${i === cur ? 'bg-accent/10 ring-1 ring-accent/30' : 'bg-subtle/60'}">
        <span class="w-7 h-7 shrink-0 rounded-full grid place-items-center text-xs font-bold ${s.done ? 'bg-ok text-white' : i === cur ? 'bg-accent text-accent-fg' : 'bg-line text-muted'}">${s.done ? ic('check') : i + 1}</span>
        <span class="min-w-0"><span class="block text-sm font-semibold">${s.label}</span><span class="block text-xs text-muted mt-0.5">${s.info || ''}</span></span></li>`).join('')}</ol>
      ${next ? `<div class="mt-4 flex flex-wrap items-center gap-3 p-4 rounded-lg border border-dashed border-accent/40"><span class="text-accent">${ic('arrow-right')}</span><div class="flex-1 min-w-[200px]"><p class="text-sm font-semibold">Bước tiếp theo: ${next.title}</p><p class="text-xs text-muted mt-0.5">${next.text}</p></div>${next.button || ''}</div>`
        : `<div class="mt-4 p-4 rounded-lg bg-ok/10 text-ok text-sm font-medium flex items-center gap-2">${ic('circle-check')}Đã hoàn tất các bước của ${VMA.appById(cfg.app).name} cho vụ án này.</div>`}
    </section>
    ${cfg.caseExtra?.(c.code) || ''}
    <section class="panel overflow-hidden">
      <div class="flex flex-wrap items-center gap-3 px-5 py-4 border-b border-line"><h2 class="text-sm font-bold">Chứng cứ của vụ án</h2>
        <span class="text-xs text-muted">${evs.filter(e => !e.parent).length} tệp gốc · ${evs.filter(e => e.parent).length} bản phái sinh / đoạn cắt</span>
        <span class="flex-1"></span>${cfg.evidenceButton || ''}</div>
      ${evs.length ? `<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr><th class="th">Mã</th><th class="th">Tệp</th><th class="th">Thời gian ghi</th><th class="th">Tiếp nhận</th><th class="th">SHA-256</th><th class="th"><span class="sr-only">Mở</span></th></tr></thead><tbody>
        ${evs.map(e => `<tr class="border-t border-line hover:bg-subtle/60">
          <td class="td font-mono text-xs whitespace-nowrap">${e.parent ? '└ ' : ''}${e.ev}</td>
          <td class="td"><div class="flex items-center gap-3 min-w-[220px]"><span class="w-14 h-9 rounded-sm overflow-hidden bg-black shrink-0">${e.thumb ? `<img src="${e.thumb}" class="w-full h-full object-cover" alt="">` : VMA.thumbFor ? VMA.thumbFor(e) : ''}</span>
            <span class="min-w-0"><span class="block font-medium truncate max-w-[260px]">${esc(e.name)}</span><span class="flex items-center gap-1.5 mt-0.5">${VMA.originTag(e.origin)}<span class="text-xs text-muted">${esc(e.cam || '')}</span></span></span></div></td>
          <td class="td text-xs text-muted whitespace-nowrap">${e.start ? fmtDate(e.start) : '—'}${e.dur ? ` · ${fmtTime(e.dur)}` : ''}</td>
          <td class="td text-xs text-muted whitespace-nowrap">${fmtDate(e.at)}<br>${esc(e.by || '')}</td>
          <td class="td"><span class="font-mono text-xs" title="${e.sha}">${shortHash(e.sha)}</span> <span class="tag bg-ok/10 text-ok ml-1" data-tip="Mã băm hiện tại trùng mã băm lúc tiếp nhận">Khớp</span></td>
          <td class="td text-right"><button class="btn btn-quiet h-8 text-xs" data-sh="ev" data-id="${e.ev}">${cfg.openLabel || 'Mở'}</button></td></tr>`).join('')}
      </tbody></table></div>` : `<div class="p-8 text-center"><span class="w-11 h-11 mx-auto rounded-lg bg-accent/10 text-accent grid place-items-center text-xl">${ic('folder-open')}</span><p class="font-semibold mt-3">Vụ án chưa có chứng cứ</p><p class="text-sm text-muted mt-1">${cfg.emptyTreeHint || ''}</p></div>`}
    </section>`;
};

/* ---------- create a case (CASE-01) ---------- */
VMA.newCase = () => {
  const nums = VMA.db.cases().map(c => +c.code.split('-')[1]).filter(Boolean), next = `VA-${Math.max(...nums) + 1}`;
  const d = VMA.modal(`<form class="p-6 space-y-4" novalidate><h2 class="text-lg font-bold">Tạo vụ án</h2>
    <div class="grid sm:grid-cols-2 gap-4">
      <label class="block"><span class="label">Mã vụ án</span><input id="ncCode" class="inp mt-1.5 font-mono uppercase" value="${next}" required><span class="err hidden text-xs text-danger mt-1 block"></span></label>
      <label class="block"><span class="label">Số quyết định (không bắt buộc)</span><input id="ncDec" class="inp mt-1.5" placeholder="${next.slice(3)}/QĐ"></label>
    </div>
    <label class="block"><span class="label">Tên vụ án</span><input id="ncTitle" class="inp mt-1.5" placeholder="Ví dụ: Trộm cắp xe máy tại phố Huế" required><span class="err hidden text-xs text-danger mt-1 block"></span></label>
    <label class="block"><span class="label">Điều tra viên phụ trách</span><input id="ncLead" class="inp mt-1.5" value="${VMA.USER.name}"></label>
    <div class="flex justify-end gap-2 pt-2"><button type="button" class="btn btn-quiet" data-close>Hủy</button><button class="btn btn-primary">${ic('folder-plus')}Tạo vụ án</button></div></form>`);
  d.querySelector('[data-close]').onclick = () => VMA.closeModal();
  d.querySelector('form').onsubmit = e => {
    e.preventDefault(); let ok = true;
    const code = $('#ncCode').value.trim().toUpperCase(), title = $('#ncTitle').value.trim();
    const fail = (id, m) => { const el = $(id).nextElementSibling; el.textContent = m; el.classList.toggle('hidden', !m); if (m) ok = false; };
    fail('#ncCode', !/^[A-ZĐ]{1,4}-\d{2,5}$/.test(code) ? 'Mã theo dạng VA-117.' : VMA.db.caseOf(code) ? 'Mã này đã tồn tại.' : '');
    fail('#ncTitle', title.length < 3 ? 'Tên vụ án tối thiểu 3 ký tự.' : '');
    if (!ok) return;
    VMA.db.addCase({ code, title, decision: $('#ncDec').value.trim() || code.slice(3) + '/QĐ', lead: $('#ncLead').value.trim() || VMA.USER.name, opened: new Date().toISOString(), status:'Đang điều tra' });
    VMA.audit('Mở hồ sơ vụ án', code, code); VMA.closeModal(); VMA.renderTree(); VMA.setTab('case'); VMA.toast(`Đã tạo vụ án ${code}`, 'success');
  };
};

/* ---------- evidence menu: rename, remove, open in another app (EVD-10, EVD-11, PLAT-02) ---------- */
VMA.popover = (anchor, html) => {
  VMA.closePopover(); const m = document.createElement('div'); m.id = 'vmaPop';
  m.className = 'fixed z-[70] min-w-[240px] max-w-[340px] panel shadow-xl py-1.5 fade-in'; m.setAttribute('role', 'menu'); m.innerHTML = html; document.body.append(m);
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = clamp(r.right - w, 8, innerWidth - w - 8) + 'px'; m.style.top = (r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6) + 'px';
  anchor.setAttribute('aria-expanded', 'true'); m._anchor = anchor; m.querySelector('button,a')?.focus();
  return m;
};
VMA.closePopover = () => { const m = $('#vmaPop'); if (m) { m._anchor?.setAttribute('aria-expanded', 'false'); m.remove(); } };
document.addEventListener('mousedown', e => { if ($('#vmaPop') && !e.target.closest('#vmaPop') && !e.target.closest('[aria-haspopup]')) VMA.closePopover(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#vmaPop')) { const a = $('#vmaPop')._anchor; VMA.closePopover(); a?.focus(); } });
const menuItem = (act, icon, label, extra = '') => `<button role="menuitem" class="w-full flex items-center gap-3 px-3.5 h-9 text-sm text-left hover:bg-subtle focus-visible:bg-subtle focus-visible:outline-none" data-sh="${act}" ${extra}>${ic(icon, 'text-muted')}<span class="flex-1">${label}</span></button>`;
VMA.menuItem = menuItem;
function evMenu(btn) {
  const e = VMA.db.ev(btn.dataset.id), cfg = VMA.cfg, own = (cfg.evidenceActions?.(e) || []);
  VMA.popover(btn, `${own.map(o => menuItem('app-act', o.icon, o.label, `data-id="${e.ev}" data-act="${o.act}"`)).join('')}
    <div class="my-1 border-t border-line"></div>
    ${menuItem('rename', 'pencil', 'Đổi tên hiển thị', `data-id="${e.ev}"`)}${menuItem('remove', 'trash-2', 'Gỡ khỏi vụ án', `data-id="${e.ev}"`)}`);
}
async function renameEv(id) {
  const e = VMA.db.ev(id);
  const d = VMA.modal(`<form class="p-6 space-y-4" novalidate><h2 class="text-lg font-bold">Đổi tên hiển thị</h2><p class="text-sm text-muted">Tên tệp gốc vẫn được giữ nguyên trong metadata; mã băm không đổi.</p>
    <label class="block"><span class="label">Tên hiển thị</span><input id="rnName" class="inp mt-1.5" value="${esc(e.name)}"></label>
    <div class="flex justify-end gap-2"><button type="button" class="btn btn-quiet" data-close>Hủy</button><button class="btn btn-primary">Lưu</button></div></form>`);
  d.querySelector('[data-close]').onclick = () => VMA.closeModal();
  d.querySelector('form').onsubmit = ev => { ev.preventDefault(); const v = $('#rnName').value.trim(); if (!v) return; const old = e.name; e.origName ||= old; e.name = v; VMA.db.save(); VMA.audit('Đổi tên hiển thị', `${e.ev}: ${old} → ${v}`); VMA.closeModal(); VMA.refresh(); };
}
async function removeEv(id) {
  const e = VMA.db.ev(id), kids = VMA.db.data.evidence.filter(k => k.parent === id && !k.removed);
  const r = await VMA.confirm({ title:`Gỡ ${e.ev} khỏi vụ án?`, danger:true, ok:'Gỡ khỏi vụ án', reason:'Ví dụ: tải nhầm vụ án',
    body:`Chứng cứ chuyển sang trạng thái đã gỡ, không xóa vật lý khỏi kho lưu trữ (WORM). ${kids.length ? `${kids.length} bản phái sinh / đoạn cắt đi kèm cũng bị gỡ.` : ''}` });
  if (!r) return;
  [e, ...kids].forEach(x => { x.removed = { at: Date.now(), reason: r }; });
  VMA.db.save(); VMA.audit('Gỡ chứng cứ khỏi vụ án', `${e.ev} · lý do: ${r}`); if (VMA.selectedEv === id) VMA.selectedEv = null; VMA.refresh(); VMA.toast(`Đã gỡ ${e.ev}`, 'success');
}
VMA.refresh = () => { VMA.renderTree(); if (VMA.tab === 'case') VMA.renderCase(); VMA.cfg.onRefresh?.(); };

let tourI = -1;
VMA.tour = (i = 0) => {
  const T = VMA.cfg.tour; tourI = i; if (i < 0 || i >= T.length) return endTour();
  const st = T[i]; if (st.tab && VMA.tab !== st.tab) VMA.setTab(st.tab);
  setTimeout(() => {
    const el = $(st.sel); if (!el || !el.getClientRects().length) return VMA.tour(i + 1);
    el.scrollIntoView({ block:'nearest' });
    const r = el.getBoundingClientRect(), p = 6;
    let ring = $('#coach'); if (!ring) { ring = document.createElement('div'); ring.id = 'coach'; document.body.append(ring); }
    Object.assign(ring.style, { left: r.left - p + 'px', top: r.top - p + 'px', width: r.width + p * 2 + 'px', height: r.height + p * 2 + 'px' });
    let card = $('#coachCard'); if (!card) { card = document.createElement('div'); card.id = 'coachCard'; card.setAttribute('role', 'dialog'); document.body.append(card); }
    card.className = 'fixed z-[96] w-[min(340px,calc(100vw-32px))] panel p-5 shadow-2xl fade-in';

/* 4-point perspective: solve the homography from the output rectangle to the picked quad, then sample bilinearly */
function homography(src, dst) {  // maps src[i] -> dst[i]

  for (let i = 0; i < 4; i++) { const [x, y] = src[i], [u, v] = dst[i]; A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); B.push(u); A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); B.push(v); }

    for (let r = 0; r < 8; r++) if (r !== c) { const f = A[r][c] / A[c][c]; for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k]; B[r] -= f * B[c]; } }

}

  for (let y = 0; y < oh; y++) for (let x = 0; x < ow; x++) {

}

/* ---------- source selection ---------- */
async function openEvidence(e, t = 0) {
  if (!e) return;
  if (e.removed) return VMA.toast('Chứng cứ này đã bị gỡ khỏi vụ án.', 'warn');
  if (e.local && !UPL[e.ev]) { VMA.setTab(modeOf(e)); showSourceError(e); return; }
  VMA.selectedEv = e.ev; VMA.renderTree(); VMA.setTab(modeOf(e));
  const dur = e.kind === 'video' ? (UPL[e.ev]?.video?.duration || e.dur || 60) : 0;
  E.src = { ev:e.ev, e, kind:e.kind, dur, img:null }; E.t = clamp(t, 0, dur); E.inT = E.outT = null; E.redacts = []; E.zoom = 1; E.pan = { x:0, y:0 };
  E.steps = (store.get('enh.steps.' + e.ev, null) || []).map(s => ({ ...s, uid: uid++ }));
  store.set('enh.opened.' + caseCode(), true);
  VMA.audit('Mở chứng cứ để xử lý', `${e.ev} ${e.name}`);

}

    <button class="btn btn-primary" data-en="upload">${ic('upload')}Chọn lại tệp</button></div>`;

}

  else if (E.hold) cvO.style.clipPath = 'none';
  else { const hx = $('#stage').clientWidth * E.split / 100, cx = clamp((hx - A.tx) / A.s / base.width * 100, 0, 100); cvO.style.clipPath = `inset(0 ${100 - cx}% 0 0)`; cvO.style.width = base.width + 'px'; }

function toImg(ev) { const r = $('#paneA').getBoundingClientRect(), L = E.layoutA; return { x: clamp((ev.clientX - r.left - L.tx) / L.s / L.w, 0, 1), y: clamp((ev.clientY - r.top - L.ty) / L.s / L.h, 0, 1) }; }
let drag = null;
function bindStage() {
  const st = $('#stage');
  st.addEventListener('pointerdown', ev => {
    if (!E.src?.img || ev.target.closest('button,#roiBar')) return;
    if (ev.target.id === 'splitH') { drag = { k:'split' }; }
    else if (E.roi) {
      const p = toImg(ev);
      if (E.roi.mode === 'quad') { const near = E.roi.pts.findIndex(q => Math.hypot((q[0] - p.x) * E.layoutA.w, (q[1] - p.y) * E.layoutA.h) < 14 / E.layoutA.s); if (near >= 0) drag = { k:'pt', i:near }; else if (E.roi.pts.length < 4) { E.roi.pts.push([p.x, p.y]); drawRoi(); } }
      else drag = { k:'rect', x0:p.x, y0:p.y };
    } else drag = { k:'pan', x:ev.clientX - E.pan.x, y:ev.clientY - E.pan.y };
    st.setPointerCapture(ev.pointerId);
  });
  st.addEventListener('pointermove', ev => {
    if (!drag) return;
    if (drag.k === 'split') { const r = st.getBoundingClientRect(); E.split = clamp((ev.clientX - r.left) / r.width * 100, 0, 100); layout(); }
    else if (drag.k === 'pan') { E.pan = { x: ev.clientX - drag.x, y: ev.clientY - drag.y }; layout(); }
    else if (drag.k === 'pt') { const p = toImg(ev); E.roi.pts[drag.i] = [p.x, p.y]; drawRoi(); }
    else { const p = toImg(ev); E.roi.rect = { x: Math.min(drag.x0, p.x), y: Math.min(drag.y0, p.y), w: Math.abs(p.x - drag.x0), h: Math.abs(p.y - drag.y0) }; drawRoi(); }
  });
  st.addEventListener('pointerup', () => { drag = null; });
  st.addEventListener('wheel', ev => { if (!E.src?.img) return; ev.preventDefault(); zoomBy(ev.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive:false });
  $('#splitH').addEventListener('keydown', ev => { if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') { E.split = clamp(E.split + (ev.key === 'ArrowLeft' ? -2 : 2), 0, 100); layout(); ev.preventDefault(); } });
  const holdOn = () => { E.hold = true; layout(); }, holdOff = () => { if (E.hold) { E.hold = false; layout(); } };

  addEventListener('keyup', ev => { if (ev.key.toLowerCase() === 'h') holdOff(); });

}

  E.redacts.forEach(r => items.push(`<rect x="${r.x * L.w}" y="${r.y * L.h}" width="${r.w * L.w}" height="${r.h * L.h}" fill="rgba(120,120,120,.55)" stroke="#fff" stroke-dasharray="${4 / L.s}" stroke-width="${sw}"/>`));

async function zipPackage() {
  if (!window.JSZip) return VMA.toast('Không tải được thư viện nén .zip. Kiểm tra kết nối rồi thử lại.', 'error');
  const list = store.get(repKey(), []), reps = store.get('enh.reports', []).filter(r => r.case === caseCode()), derived = VMA.db.evidenceOf(caseCode()).filter(e => e.origin === 'enhanced');
  if (!list.length && !reps.length) return VMA.toast('Chưa có ảnh trong báo cáo hay bản phái sinh nào để đóng gói.', 'warn');
  const z = new JSZip(), sums = [], add = async (path, data) => { z.file(path, data); sums.push(`${await VMA.sha256(data instanceof Blob ? data : typeof data === 'string' ? data : new Blob([data]))}  ${path}`); };
  for (const r of list) { const bin = Uint8Array.from(atob(r.img.split(',')[1]), ch => ch.charCodeAt(0)); await add(`02_AnhBaoCao/${r.ev}_${r.id}.jpg`, new Blob([bin])); }
  for (const r of reps) await add(`03_BaoCaoXuLy/${r.ev}_baocao.json`, JSON.stringify(r.rep, null, 2));
  await add('01_DanhMucPhaiSinh.json', JSON.stringify(derived.map(({ thumb, ...e }) => e), null, 2));
  await add('README.txt', `Gói chứng cứ Enhance · vụ án ${caseCode()} · ${fmtDate(new Date())}\nGồm ảnh đã chèn báo cáo, báo cáo xử lý (JSON) và danh mục bản phái sinh. Bản gốc lưu ở kho chứng cứ, không nằm trong gói.\nKiểm tra: sha256sum -c SHA256SUMS.txt`);
  z.file('SHA256SUMS.txt', sums.join('\n') + '\n');
  const blob = await z.generateAsync({ type:'blob' }), name = `GoiChungCu_${caseCode()}_Enhance_${new Date().toISOString().slice(0, 10).replaceAll('-', '')}.zip`;
  if (await VMA.save(blob, name)) VMA.audit('Xuất gói chứng cứ', name);
}

document.addEventListener('click', ev => {

  const k = el.dataset.en, v = el.dataset.v, st = () => E.steps.find(s => s.uid === +v);
  const fn = {
    view: () => { E.view = v; layout(); }, panel: () => { E.panel = v; renderPanel(); },
    zoom: () => { if (+v === 0) { E.zoom = 1; E.pan = { x:0, y:0 }; layout(); } else zoomBy(+v > 0 ? 1.25 : .8); },
    add: () => addStep(v), 'roi-start': () => startRoi(v), 'roi-cancel': endRoi,
    'roi-ok': () => { const r = E.roi; endRoi(); if (r.tool === 'redact') { E.redacts.push(r.rect); drawRoi(); VMA.audit('Thêm vùng làm mờ', E.src.ev); return; }
      if (r.reuid) { const s = E.steps.find(x => x.uid === r.reuid); if (r.mode === 'quad') s.p.pts = r.pts; else s.p.roi = r.rect; process(); renderPanel(); return; }
      addStep(r.tool, r.mode === 'quad' ? { pts: r.pts } : { roi: r.rect }); },
    reroi: () => { const s = st(); startRoi(s.op); E.roi.reuid = s.uid; },
    redact: () => startRoi('redact'),
    sel: () => { E.sel = E.sel === +v ? null : +v; renderChain(); },
    toggle: () => { const s = st(); s.on = !s.on; VMA.audit(s.on ? 'Bật bước' : 'Tắt bước', T[s.op].name); renderChain(); process(); },
    up: () => { const i = E.steps.findIndex(s => s.uid === +v); [E.steps[i - 1], E.steps[i]] = [E.steps[i], E.steps[i - 1]]; VMA.audit('Đổi thứ tự bước', T[E.steps[i - 1].op].name); renderChain(); process(); },
    down: () => { const i = E.steps.findIndex(s => s.uid === +v); [E.steps[i + 1], E.steps[i]] = [E.steps[i], E.steps[i + 1]]; VMA.audit('Đổi thứ tự bước', T[E.steps[i + 1].op].name); renderChain(); process(); },
    del: () => { const s = st(); E.steps = E.steps.filter(x => x !== s); VMA.audit('Xóa bước', T[s.op].name); renderChain(); process(); },
    'reset-step': () => { const s = st(); s.p = { ...ENG.defaults(s.op), ...(s.p.roi ? { roi: s.p.roi } : {}), ...(s.p.pts ? { pts: s.p.pts } : {}) }; renderChain(); process(); },
    undo: () => { const s = E.steps.pop(); if (s) { VMA.audit('Bỏ bước cuối', T[s.op].name); renderChain(); process(); } },
    'preset-menu': () => presetMenu(el), preset: () => applyPreset(+v), 'save-preset': savePreset, repro: reproCheck,
    export: exportDialog, 'report-insert': insertReport, 'save-derived': () => saveDerived(), 'snap-frame': snapFrame,
    pick: pickDialog, upload: uploadDialog,

    pdf: pdfReport, zip: zipPackage
  }[k];
  if (fn) fn();
});
addEventListener('keydown', ev => {
  if (!inWork() || ev.target.closest('input,textarea,select') || $('#vmaModal') || $('#vmaLock')) return;
  if (ev.key === '+' || ev.key === '=') zoomBy(1.25); else if (ev.key === '-') zoomBy(.8); else if (ev.key === '0') { E.zoom = 1; E.pan = { x:0, y:0 }; layout(); }
  else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); $('[data-en="undo"]')?.click() || (E.steps.pop(), process(), renderPanel()); }
  else if (ev.key === ' ' && E.src?.kind === 'video') { ev.preventDefault(); togglePlay(); }
  else if (ev.key.toLowerCase() === 'i' && E.src?.kind === 'video') $('[data-en="mark-in"]').click();
  else if (ev.key.toLowerCase() === 'o' && E.src?.kind === 'video') $('[data-en="mark-out"]').click();
  else if (ev.key.toLowerCase() === 's' && !ev.ctrlKey && !ev.metaKey && E.src?.kind === 'video') snapFrame();
  else if (ev.key === 'Escape' && E.roi) endRoi();
});

  { q:'Sửa ảnh chụp chéo bằng 4 điểm', kw:['phoi canh', 'cheo', 'nghieng', '4 diem', 'perspective', 'nan thang'], a:['Tab Bộ lọc, nhóm Phóng to và biến đổi hình học, chọn “Sửa phối cảnh 4 điểm”.', 'Bấm lần lượt 4 góc trên trái, trên phải, dưới phải, dưới trái; kéo điểm để chỉnh rồi bấm Áp dụng.'], show:{ tab:'img', sel:'#panel', panel:'filters' } }
];
VMA.shell({
  app:'enhance', start:'case', views:VIEWS,
  tabs:[{ id:'case', label:'Tổng quan', icon:'folder-open' }, { id:'img', label:'Xử lý ảnh', icon:'image', tip:'Ảnh và khung hình chụp từ video: công cụ AI, bộ lọc, làm mờ, xuất ảnh' }, { id:'vid', label:'Xử lý video', icon:'clapperboard', tip:'Tua, đặt In / Out, xem trước trên một khung rồi xử lý cả đoạn' }, { id:'jobs', label:'Hàng đợi', icon:'list-video', tip:'Các lệnh xử lý video' }, { id:'report', label:'Báo cáo', icon:'file-text' }],
  openLabel:'Xử lý', emptyTreeHint:'Thêm ảnh, video từ máy để bắt đầu.',
  sidebarFoot:`<button class="btn btn-ghost w-full justify-start" data-en="upload">${ic('upload')}Thêm ảnh, video từ máy</button>`,
  evidenceButton:`<button class="btn btn-quiet h-8 text-xs" data-en="upload">${ic('upload')}Thêm từ máy</button>`,
  keys:[['H', 'Giữ để xem ảnh gốc'], ['+ −', 'Phóng to, thu nhỏ'], ['0', 'Vừa khung'], ['Ctrl Z', 'Bỏ bước cuối'], ['Space', 'Phát / dừng video'], ['I O', 'Điểm vào / ra']],
  steps: code => { const evs = VMA.db.evidenceOf(code), der = evs.filter(e => e.origin === 'enhanced'), rep = store.get('enh.report.' + code, []);
    return [{ label:'Chọn chứng cứ', done: !!store.get('enh.opened.' + code, false), info:`${evs.filter(e => !e.parent).length} chứng cứ trong vụ án` },
      { label:'Dựng chuỗi xử lý', done: evs.some(e => (store.get('enh.steps.' + e.ev, []) || []).length), info:'Công cụ AI và bộ lọc' },
      { label:'Lưu bản phái sinh', done: der.length > 0, info:`${der.length} bản đã cải thiện` },
      { label:'Xuất ảnh, báo cáo', done: rep.length > 0, info:`${rep.length} ảnh trong báo cáo` }]; },
  nextStep: (code, i) => [
    { title:'Chọn chứng cứ cần xử lý', text:'Chọn video hoặc ảnh ở cột trái, hoặc thêm từ máy.', button:`<button class="btn btn-primary" data-en="pick">${ic('folder-open')}Chọn chứng cứ</button>` },
    { title:'Dựng chuỗi xử lý', text:'Thêm công cụ AI hoặc bộ lọc; mỗi bước được ghi lại để tái lập.', button:`<span class="flex flex-wrap gap-2"><button class="btn btn-primary" data-sh="tab" data-tab="img">${ic('image')}Xử lý ảnh</button><button class="btn btn-quiet" data-sh="tab" data-tab="vid">${ic('clapperboard')}Xử lý video</button></span>` },
    { title:'Lưu bản phái sinh vào vụ án', text:'Ảnh: Lưu vào vụ án. Video: Xử lý video, kết quả vào Hàng đợi. Bản phái sinh nằm dưới chứng cứ gốc, kèm báo cáo xử lý.', button:`<button class="btn btn-primary" data-sh="tab" data-tab="img">${ic('save')}Đến Xử lý ảnh</button>` },
    { title:'Xuất ảnh, chèn vào báo cáo', text:'Xuất ảnh có dải chú thích, làm mờ mặt và biển số; đưa ảnh đã làm rõ vào báo cáo vụ án.', button:`<button class="btn btn-primary" data-sh="tab" data-tab="img">${ic('file-plus')}Chèn vào báo cáo</button>` }][i],
  caseActions: () => `<button class="btn btn-quiet" data-en="upload">${ic('upload')}Thêm ảnh, video</button><button class="btn btn-quiet" data-sh="tab" data-tab="vid">${ic('clapperboard')}Xử lý video</button><button class="btn btn-primary" data-sh="tab" data-tab="img">${ic('image')}Xử lý ảnh</button>`,
  onEvidence: e => openEvidence(e),
  evidenceActions: e => [{ act:'process', icon:'wand-sparkles', label:'Mở để xử lý' }],
  onEvidenceAction: (act, e) => { if (act === 'process') openEvidence(e); },
  onTab: id => { if (id === 'img' || id === 'vid') useMode(id); else if (E.playing) togglePlay(false); if (id === 'jobs') renderJobs(); if (id === 'report') renderReportView(); },
  onRefresh: () => { if (E.src && VMA.db.ev(E.src.ev)?.removed) { E.src = null; $('#empty').classList.remove('hidden'); } },
  onLock: () => togglePlay(false),
  welcome:{ title:'Chào mừng đến với Enhance', steps:[['folder-open', 'Chọn chứng cứ', 'Video, ảnh của vụ án ở cột trái, hoặc thêm từ máy.'], ['wand-sparkles', 'Xử lý ảnh hoặc video', 'Hai tab riêng. Công cụ AI và 25 bộ lọc; so sánh trước – sau, histogram. Chụp khung từ video để xử lý như ảnh.'], ['save', 'Lưu bản phái sinh, xuất báo cáo', 'Mọi bước được ghi lại để tái lập; bản gốc giữ nguyên.']] },
  tour:[
    { sel:'#caseTree', t:'Chứng cứ của vụ án', d:'Video, ảnh gốc và các bản đã cải thiện (nhãn tím) nằm dưới bản gốc. Bấm một mục để mở xử lý.' },
    { tab:'img', sel:'#stage', t:'Xử lý ảnh', d:'Ảnh và khung hình chụp từ video. Lăn chuột để phóng to, kéo để di chuyển. Thanh trắng chia đôi ảnh gốc và ảnh đã xử lý.' },
    { tab:'img', sel:'#cmpSeg', t:'So sánh trước – sau', d:'Một ảnh, Chia đôi hoặc Song song. Giữ phím H để xem nhanh ảnh gốc.' },
    { tab:'img', sel:'#panel', t:'Công cụ AI và bộ lọc', d:'Thêm bước vào chuỗi. Siêu phân giải, phục hồi khuôn mặt, sửa phối cảnh yêu cầu chọn vùng trên ảnh.' },
    { tab:'img', sel:'#tabChain', t:'Chuỗi xử lý', d:'Đổi thứ tự, bật tắt, chỉnh tham số từng bước. Lưu thành mẫu để dùng lại; kiểm tra tái lập bằng mã băm.' },
    { tab:'img', sel:'#actBar', t:'Xuất và lưu', d:'Vùng làm mờ, xuất ảnh có chú thích, chèn vào báo cáo, lưu bản phái sinh vào vụ án.' },
    { tab:'vid', sel:'#vidBar', t:'Xử lý video', d:'Tua tới khung cần xem, dựng chuỗi trên khung đó, đặt In / Out rồi Xử lý video. Chụp khung để chuyển một khung sang Xử lý ảnh.' }
  ],
  kb:KB,
  onShow: show => { VMA.setTab(show.tab || 'img'); if (show.panel) { E.panel = show.panel; renderPanel(); } setTimeout(() => VMA.spot(show.sel), 250); },
  settings: () => `<fieldset class="space-y-3 pt-2 border-t border-line"><legend class="label pt-3">Enhance</legend>
    <label class="flex items-start gap-3"><span class="switch mt-0.5"><input type="checkbox" id="stStamp" ${store.get('enh.stamp', true) ? 'checked' : ''}><span></span></span><span class="text-sm">Đóng dấu chú thích khi xuất ảnh<span class="block text-xs text-muted">Mã vụ án, mã chứng cứ, thời điểm, chữ “Ảnh đã xử lý bằng AI”.</span></span></label>
    <label class="flex items-start gap-3"><span class="switch mt-0.5"><input type="checkbox" id="stRed" ${store.get('enh.autoRedact', false) ? 'checked' : ''}><span></span></span><span class="text-sm">Luôn làm mờ mặt và biển số khi xuất<span class="block text-xs text-muted">Tự áp dụng với khung hình chưa đổi hình học; các trường hợp khác cần vẽ vùng làm mờ.</span></span></label></fieldset>`,
  settingsBind: d => { $('#stStamp', d).onchange = e => { store.set('enh.stamp', e.target.checked); VMA.audit('Đổi cài đặt', 'Đóng dấu chú thích: ' + e.target.checked); }; $('#stRed', d).onchange = e => { store.set('enh.autoRedact', e.target.checked); VMA.audit('Đổi cài đặt', 'Luôn làm mờ khi xuất: ' + e.target.checked); }; }
});
bindStage(); renderPanel(); tickJobs();
useMode('img');
VMA.requireLogin('enhance');

</script>
</body></html>
