<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
</head>
<body style="margin:0">
<title>Phát triển hãng</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell của phần mềm nội bộ (sidebar + header trắng). Ba tab: Danh sách tiềm năng (bảng crawl), Hãng phát triển (Kanban/bảng), Quản lý NCC. Chi tiết mở dạng ngăn kéo bên phải */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#f7f8fa; --line:#e3e7ee; --line-2:#d3d9e3;
  --fg:#1d2733; --muted:#66727f; --faint:#9aa4b0;
  --navy:#0e2a47; --navy-fg:#ffffff; --navy-soft:#e7edf5;
  --kt:#7c3aed; --kt-soft:#f1eafe; --xnk:#d9480f; --xnk-soft:#fff0e6; --kd:#0f8a7e; --kd-soft:#e3f6f3;
  --ok:#1f9d55; --ok-soft:#e5f6ec; --warn:#b7791f; --warn-soft:#fdf3dd; --bad:#d64545; --bad-soft:#fdeaea;
  --shadow:0 10px 40px rgba(14,42,71,.18);
  --font:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e27; --surface-2:#1c2430; --line:#26303d; --line-2:#334051;
  --fg:#e4e9ef; --muted:#9aa6b4; --faint:#6b7786;
  --navy:#4d82c4; --navy-fg:#0b1118; --navy-soft:#1d2b3d;
  --kt:#b18cff; --kt-soft:#2a2140; --xnk:#ff8f57; --xnk-soft:#3a2416; --kd:#4fd1c0; --kd-soft:#14322f;
  --ok:#4ade80; --ok-soft:#173022; --warn:#f6c453; --warn-soft:#352b14; --bad:#f87171; --bad-soft:#3a1a1a;
  --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e27; --surface-2:#1c2430; --line:#26303d; --line-2:#334051;
  --fg:#e4e9ef; --muted:#9aa6b4; --faint:#6b7786;
  --navy:#4d82c4; --navy-fg:#0b1118; --navy-soft:#1d2b3d;
  --kt:#b18cff; --kt-soft:#2a2140; --xnk:#ff8f57; --xnk-soft:#3a2416; --kd:#4fd1c0; --kd-soft:#14322f;
  --ok:#4ade80; --ok-soft:#173022; --warn:#f6c453; --warn-soft:#352b14; --bad:#f87171; --bad-soft:#3a1a1a;
  --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--navy)}

/* Shell */
.app{display:flex;min-height:100%}
.side{width:224px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:15px;padding:4px 10px 14px;letter-spacing:.02em;color:var(--navy)}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav.on{background:var(--navy-soft);color:var(--navy);font-weight:600}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--muted)}
.nav .cnt.new{background:var(--bad);border-color:var(--bad);color:#fff}
.nav-flow{font-size:11px;color:var(--faint);padding:0 10px 0 33px;line-height:1.2}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top h1{font-size:17px;margin:0;font-weight:600;text-wrap:balance}
.top .who{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.content{padding-block:16px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;min-width:0}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--navy-fg)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:4px 9px;font-size:12.5px}
.ico{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button.on{background:var(--navy);color:var(--navy-fg)}
.seg.sm button{padding:3px 9px;font-size:12px}
.seg.st button.on.ok{background:var(--ok);color:#fff}
.seg.st button.on.bad{background:var(--bad);color:#fff}
.seg.st button.on.unk{background:var(--faint);color:#fff}
.field{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:0}
.field:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft)}
textarea.field{resize:vertical;min-height:70px;width:100%}
.search{width:240px;max-width:100%}

/* Chips */
.dept{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;letter-spacing:.04em;border-radius:4px;padding:1px 6px;line-height:1.5;white-space:nowrap}
.dept.KT{color:var(--kt);background:var(--kt-soft)}
.dept.XNK{color:var(--xnk);background:var(--xnk-soft)}
.dept.KD{color:var(--kd);background:var(--kd-soft)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border-radius:4px;padding:1px 7px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.pill.navy{color:var(--navy);border-color:var(--navy);background:var(--navy-soft)}
.pill.new{color:#fff;border-color:var(--bad);background:var(--bad)}

/* Avatars */
.avs{display:inline-flex}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:8.5px;font-weight:700;color:#fff;border:2px solid var(--surface);margin-left:-6px;flex:none}
.avs .av:first-child{margin-left:0}
.av.lg{width:30px;height:30px;font-size:10px;margin-left:0}

/* Criteria dots */
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:9px;height:9px;border-radius:2px;background:var(--line-2)}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--bad)}

/* Summary strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.strip>div,.strip>button{border:0;background:none;text-align:left;padding:10px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.strip>*:last-child{border-right:0}
.strip .n{font-size:22px;font-weight:600;line-height:1.1}
.strip .t{font-size:12px;color:var(--muted);line-height:1.3}

/* Crawl sources */
.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.src{border:1px solid var(--line);border-radius:7px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.src b{font-weight:600}
.src .m{font-size:12px;color:var(--muted)}
.src .r{display:flex;gap:8px;align-items:center;margin-top:4px}
.src .r .x{margin-left:auto}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px}
.live.off{background:var(--faint)}
details.panel>summary{list-style:none;cursor:pointer}
details.panel>summary::-webkit-details-marker{display:none}
details.panel[open] .chev{transform:rotate(90deg)}
.chev{transition:transform .15s}

/* Bulk bar */
.bulk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--navy);color:var(--navy-fg);border-radius:8px;padding:8px 12px}
.bulk .btn{border-color:transparent}

/* Kanban */
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;gap:12px;min-width:min-content}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:240px}
.col.drop-on{border-color:var(--navy);background:var(--navy-soft)}
.col-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.col-h .r{display:flex;align-items:center;gap:6px}
.col-h b{font-size:13px;font-weight:600}
.col-h .c{margin-left:auto;font-size:12px;color:var(--muted)}
.col-h .s{font-size:11.5px;color:var(--muted)}
.col.hold{background:transparent;border-style:dashed}
.cards{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;cursor:pointer}
.card:hover{border-color:var(--navy);box-shadow:0 2px 10px rgba(14,42,71,.08)}
.card.dragging{opacity:.4}
.card .nm{font-weight:600;font-size:13.5px;line-height:1.3}
.card .meta{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 10px}
.card .ft{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.card .ft .r{margin-left:auto;display:flex;gap:9px;align-items:center}
.card .ft .r span{display:inline-flex;gap:3px;align-items:center}
.card.late{box-shadow:inset 3px 0 0 var(--bad)}
.card.ready{box-shadow:inset 3px 0 0 var(--ok)}
.empty-col{color:var(--faint);font-size:12px;text-align:center;padding:16px 6px}

/* Tables */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1050px}
th{font-weight:600;font-size:12.5px;text-align:left;padding:12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
tbody tr.click{cursor:pointer}
tr.fresh{background:var(--ok-soft)}
tr.muted td{color:var(--faint)}
th.c,td.c{text-align:center}
td .sub{font-size:12px;color:var(--muted)}
.cb{accent-color:var(--navy);width:15px;height:15px}
.link{border:0;background:none;padding:0;color:var(--fg);font-weight:600;text-align:left}
.link:hover{color:var(--navy);text-decoration:underline}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,32,.38);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1040px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.narrow{width:min(580px,100%)}
.d-head{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px 0;display:flex;flex-direction:column;gap:12px}
.d-head.solo{padding-bottom:14px}
.d-title{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.d-title h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.d-title .sub{color:var(--muted);font-size:12.5px;display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:3px}
.d-title .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:2px;overflow-x:auto;margin:0 -4px}
.tab{border:0;background:none;padding:9px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.tab .b{font-size:10.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:0 6px;color:var(--muted)}
.d-body{flex:1;overflow-y:auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.panel:not([open]) .panel-h{border-bottom:0}
.panel-h h3{margin:0;font-size:14px;font-weight:600}
.panel-h .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.hint{color:var(--muted);font-size:12.5px}
.note{font-size:12.5px;padding:9px 12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.note.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.kvr{display:flex;gap:12px;justify-content:space-between;align-items:baseline;font-size:13px}
.kvr>span:last-child{text-align:right}

/* Criteria */
.crit{display:flex;flex-direction:column}
.cr{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:4px 10px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:start}
.cr:last-child{border-bottom:0}
.cr .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:1px;background:var(--surface-2);border:1.5px solid var(--line-2);color:var(--faint)}
.cr .ic.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.cr .ic.no{background:var(--bad);border-color:var(--bad);color:#fff}
.cr .ic .ico{width:13px;height:13px;stroke-width:3}
.cr .t{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cr .d{grid-column:2/-1;display:flex;flex-direction:column;gap:6px}
.cr input.field{width:100%;padding:6px 9px;font-size:13px}
.cr .by{font-size:11.5px;color:var(--faint)}
.subchips{display:flex;gap:6px;flex-wrap:wrap}
.sc{border:1px solid var(--line-2);background:var(--surface);border-radius:4px;padding:1px 8px;font-size:12px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.sc.on{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.meter{display:flex;gap:4px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.meter i.ok{background:var(--ok)} .meter i.no{background:var(--bad)}

/* Form */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
.form .full{grid-column:1/-1}
.fl{display:flex;flex-direction:column;gap:6px}
.fl label{font-weight:600;font-size:13px}
.fl label .star{color:var(--bad);margin-right:3px}
.fl .field{width:100%}
.fl .field:disabled{background:var(--surface-2);color:var(--faint)}
.sec-t{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600;border-top:1px solid var(--line);margin-top:4px;padding-top:12px}
.sec-t:first-child{border-top:0;margin-top:0;padding-top:0}

/* Files */
.drop{border:1.5px dashed var(--line-2);border-radius:8px;padding:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface-2)}
.drop.over{border-color:var(--navy);background:var(--navy-soft)}
.frow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.fic{width:34px;height:38px;border-radius:5px;display:grid;place-items:center;font-size:9.5px;font-weight:700;letter-spacing:.03em;flex:none;color:#fff}
.frow .nm{font-weight:500;word-break:break-word}
.frow .mt{font-size:12px;color:var(--muted)}
.frow .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.fgrp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600;padding-top:6px}

/* Email */
.mail-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.gdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.thread{border-bottom:1px solid var(--line)}
.thread:last-child{border-bottom:0}
.th-row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 16px;border:0;background:none;width:100%;text-align:left}
.th-row:hover{background:var(--surface-2)}
.th-row .fr{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-row .sj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-row .sj em{font-style:normal;color:var(--muted)}
.th-row .dt{font-size:12px;color:var(--muted);white-space:nowrap}
.msgs{padding:4px 16px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:12px 14px}
.msg .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.msg .h b{font-weight:600}
.msg .h .ad{color:var(--muted);font-size:12px}
.msg .h .dt{margin-left:auto;color:var(--muted);font-size:12px}
.msg p{margin:0 0 6px;white-space:pre-wrap}
.att{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line-2);border-radius:6px;padding:5px 8px;font-size:12px;margin:4px 6px 0 0}
.lbl{font-size:10.5px;border-radius:3px;padding:0 5px;background:var(--navy-soft);color:var(--navy);font-weight:600;margin-right:6px}

/* Quote */
.ql{min-width:640px}
.ql td,.ql th{padding:7px 8px}
.ql input{width:100%;border:1px solid var(--line);border-radius:5px;padding:5px 7px;background:var(--surface)}
.ql input.r{text-align:right}
.calc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kv{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:7px}
.kv span{font-size:11.5px;color:var(--muted)}
.kv b{font-size:16px;font-weight:600}
.kv.hl{background:var(--navy-soft);border-color:transparent}
.kv.hl b{color:var(--navy)}

/* Timeline */
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:92px 14px minmax(0,1fr);gap:10px;padding:7px 0}
.tl-i .d{font-size:12px;color:var(--muted);text-align:right}
.tl-i .dot{width:9px;height:9px;border-radius:50%;background:var(--line-2);margin-top:6px;justify-self:center}
.tl-i .dot.KT{background:var(--kt)} .tl-i .dot.XNK{background:var(--xnk)} .tl-i .dot.KD{background:var(--kd)}

/* Modal */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(10,20,32,.45)}
.mbox{background:var(--surface);border-radius:10px;width:min(900px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
.mbox.sm{width:min(540px,100%)}
.m-h{background:var(--line);text-align:center;font-weight:600;letter-spacing:.04em;padding:13px 16px;font-size:14px;text-transform:uppercase}
.m-b{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.m-f{display:flex;justify-content:center;gap:14px;padding:14px 20px;border-top:1px solid var(--line)}
.m-f .btn{min-width:160px;justify-content:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:7px;z-index:40;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.proto{font-size:11px;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 6px;font-weight:600;white-space:nowrap}

@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}.calc{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .side{display:none}
  .form{grid-template-columns:minmax(0,1fr)}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip>*{border-bottom:1px solid var(--line)}
  .th-row{grid-template-columns:minmax(0,1fr) auto}.th-row .fr{grid-column:1/-1}
  .d-head,.d-body{padding-left:16px;padding-right:16px}
  .top .who span{display:none}
  .mobile-nav{display:flex!important}
  .cr{grid-template-columns:26px minmax(0,1fr)}.cr .seg{grid-column:2}
}
.mobile-nav{display:none}
@media (prefers-reduced-motion:no-preference){.drawer.enter{animation:slide .22s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}}

const hasCat = (v,c) => v.files.some(f=>f.cat===c);
// Trạng thái thực của từng điều kiện (catalog, báo giá tự kiểm tra theo Tài liệu)
function critState(v,id){
  if(id==='catalog') return hasCat(v,'Catalog') && (hasCat(v,'Datasheet')||hasCat(v,'HDSD')) ? 'ok' : (hasCat(v,'Catalog')?'?':'no');
  if(id==='quote') return hasCat(v,'Báo giá hãng') || v.quote.lines.some(l=>+l.price>0) ? 'ok' : 'no';
  return v.crit[id].st;
}
const critOk = v => CRITS.filter(c=>critState(v,c.id)==='ok').length;
const dotsHtml = v => `<span class="dots" title="${critOk(v)}/6 điều kiện hợp tác">${CRITS.map(c=>{const s=critState(v,c.id);return `<i class="${s==='ok'?'ok':s==='no'?'no':''}" title="${c.name}"></i>`;}).join('')}</span>`;
// Kiểm tra trùng theo domain website với NCC và hãng đang phát triển
function dupOf(p){
  const d=domainOf(p.website);
  const n=NCC.find(x=>domainOf(x.website)===d); if(n) return {type:'ncc', label:'Đã là NCC'};
  const v=vendors.find(x=>domainOf(x.website)===d); if(v) return {type:'dev', label:v.status==='done'?'Đã là NCC':'Đang phát triển', id:v.id};
  return null;
}

/* ---- Tab 1: Danh sách tiềm năng ---- */
function potFiltered(){
  const q=S.pq.trim().toLowerCase();
  return potentials.filter(p=>{
    if(S.pstat==='open' && !['new','seen'].includes(p.status)) return false;
    if(S.pstat==='skip' && p.status!=='skip') return false;
    if(S.pstat==='moved' && p.status!=='moved') return false;
    if(S.psrc!=='all' && p.src!==S.psrc) return false;
    if(q && !`${p.name} ${p.country} ${p.mang} ${p.desc} ${p.categories.join(' ')}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>(a.status==='new'?0:1)-(b.status==='new'?0:1) || (a.added<b.added?1:-1));
}

/* ---- Tab 2: Hãng phát triển ---- */
function devFiltered(){
  const q=S.q.trim().toLowerCase();
  return vendors.filter(v=>v.status!=='done').filter(v=>{
    if(q && !(`${v.name} ${v.country} ${v.mang} ${v.project} ${v.website}`.toLowerCase().includes(q))) return false;
    if(S.mine && !Object.values(v.owners).flat().includes(ME)) return false;
    return true;
  });
}
function renderDev(){

function cardHtml(v){

  return `<div class="card ${isLate(v)?'late':ok===6&&v.status==='active'?'ready':''}" data-a="open" data-id="${v.id}" draggable="${v.status==='active'}" tabindex="0" role="button">
    <div style="display:flex;gap:6px;align-items:flex-start"><span class="nm">${esc(v.name)}</span>${v.priority==='Gấp'?'<span class="pill bad" style="margin-left:auto">Gấp</span>':''}</div>
    <div class="meta"><span>${esc(v.country)}</span><span>${esc(v.mang)}</span><span>${esc(v.project||'')}</span></div>
    ${v.status==='hold'?`<div class="note bad" style="padding:5px 8px;font-size:12px">${esc(v.hold.reason)}</div>`:
    `<div style="display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)">${dotsHtml(v)}<span class="num" style="${ok===6?'color:var(--ok);font-weight:600':''}">${ok===6?'Sẵn sàng ký':ok+'/6 điều kiện'}</span><span class="num" style="margin-left:auto;${isLate(v)?'color:var(--bad);font-weight:600':''}">${v.deadline?(isLate(v)?'Trễ '+daysSince(v.deadline)+' ngày':'Hạn '+fmtD(v.deadline).slice(0,5)):''}</span></div>`}

}
function renderBoard(list){
  const cols = STAGES.map(s=>{
    const items=list.filter(v=>v.status==='active'&&v.stage===s.id);
    return `<section class="col" data-stage="${s.id}"><div class="col-h"><div class="r"><b>${s.name}</b><span class="dept ${s.dept}">${s.dept}</span><span class="c num">${items.length}</span></div><div class="s">${s.hint}</div></div>
      <div class="cards">${items.map(cardHtml).join('')||'<div class="empty-col">Kéo thẻ vào đây</div>'}</div></section>`;
  });
  const holds=list.filter(v=>v.status==='hold');
  cols.push(`<section class="col hold"><div class="col-h"><div class="r"><b>Tạm dừng</b><span class="c num">${holds.length}</span></div><div class="s">Không đạt điều kiện hoặc chờ</div></div><div class="cards">${holds.map(cardHtml).join('')||'<div class="empty-col">Trống</div>'}</div></section>`);
  return `<div class="hint">Kéo thẻ giữa các cột để đổi giai đoạn. Giai đoạn chỉ để theo dõi, không khóa. Chuyển sang hợp tác chỉ cần đủ 6 điều kiện.</div>
  <div class="board-wrap"><div class="board" style="grid-template-columns:repeat(${cols.length},minmax(250px,1fr))">${cols.join('')}</div></div>`;
}
function renderDevTable(list){

    <td>${v.status==='hold'?'<span class="pill bad">Tạm dừng</span>':`<span class="dept ${s.dept}">${s.dept}</span> ${s.name}`}</td>

/* ======================= Render: layer ======================= */
function renderLayer(){
  const L=document.getElementById('layer');
  let h='';
  if(S.openPot){ const p=potById(S.openPot); if(p) h+=renderPotDrawer(p); }
  else if(S.openId){ const v=byId(S.openId); if(v) h+=renderDrawer(v); }

  L.innerHTML=h;
  const nb=document.querySelector('.d-body'); if(nb) nb.scrollTop=st;

}

/* --- Tổng quan: 6 điều kiện --- */
function critRow(v,c){
  const st=critState(v,c.id); const cr=v.crit[c.id]; const ro=v.status!=='active';
  const icon = st==='ok'?ic('check'):st==='no'?ic('x'):ic('minus');
  let body='';
  if(c.id==='catalog'){
    const parts=['Catalog','Datasheet','HDSD'].map(k=>`<span class="sc ${hasCat(v,k)?'on':''}">${hasCat(v,k)?ic('check'):''}${k}</span>`).join('');
    body=`<div class="subchips">${parts}</div><div class="hint">Tự kiểm tra theo tab Tài liệu: cần có Catalog và Datasheet hoặc HDSD. <button class="btn sm ghost" data-a="tab" data-v="files">Mở Tài liệu ${ic('arrow')}</button></div>`;
  } else if(c.id==='quote'){
    const f=v.files.filter(f=>f.cat==='Báo giá hãng');
    body=`<div class="hint">${f.length?`Có ${f.length} file báo giá: ${f.map(x=>esc(x.name)).join(', ')}`:'Chưa có file báo giá trong Tài liệu.'} <button class="btn sm ghost" data-a="tab" data-v="quote">Xem báo giá ${ic('arrow')}</button></div>
      ${v.ndaFirst?`<div class="note ${hasCat(v,'NDA')?'ok':'warn'}" style="padding:6px 10px">Hãng yêu cầu ký NDA trước khi báo giá · ${hasCat(v,'NDA')?'đã có NDA':'chưa có NDA'}</div>`:''}`;
  } else {
    body=`${c.subs?`<div class="subchips">${c.subs.map(s=>`<button class="sc ${cr.subs.includes(s)?'on':''}" data-a="sub" data-c="${c.id}" data-v="${s}" ${ro?'disabled':''}>${cr.subs.includes(s)?ic('check'):''}${s}</button>`).join('')}</div>`:''}
      <input class="field" data-cn="${c.id}" value="${esc(cr.note)}" placeholder="${esc(c.ph)}" ${ro?'disabled':''}>
      ${cr.by?`<span class="by">${USERS[cr.by]?.name}, ${fmtD(cr.date)}</span>`:''}`;
  }
  return `<div class="cr"><span class="ic ${st==='ok'?'ok':st==='no'?'no':''}">${icon}</span>
    <div class="t">${c.name} <span class="dept ${c.dept}">${c.dept}</span></div>
    ${c.auto?`<span class="pill ${st==='ok'?'ok':st==='no'?'bad':'warn'}">${st==='ok'?'Đạt':st==='no'?'Chưa có':'Thiếu'} · tự động</span>`:
      `<div class="seg sm st">${[['ok','Đạt'],['no','Chưa đạt'],['?','Chưa rõ']].map(([k,l])=>`<button class="${cr.st===k?'on '+(k==='ok'?'ok':k==='no'?'bad':'unk'):''}" data-a="crit" data-c="${c.id}" data-v="${k}" ${ro?'disabled':''}>${l}</button>`).join('')}</div>`}
    <div class="d">${body}</div></div>`;
}

  ${done?`<div class="note ok">Đã ký ${esc(v.coopType)} ngày ${fmtD(v.signDate)} và chuyển sang Quản lý thông tin NCC ngày ${fmtD(v.doneDate)}. Hồ sơ chỉ xem.</div>`:''}

      <div style="padding:12px 16px 0"><div class="meter">${CRITS.map(c=>{const s=critState(v,c.id);return `<i class="${s==='ok'?'ok':s==='no'?'no':''}"></i>`;}).join('')}</div></div>

        <div class="kvr"><span class="hint">Giai đoạn</span><span>${STAGES[SIDX[v.stage]].name}</span></div>
        <div class="kvr"><span class="hint">Dự án / nhu cầu</span><span>${esc(v.project||'—')}</span></div>
        <div class="kvr"><span class="hint">Mức ưu tiên</span><span>${v.priority==='Gấp'?'<span class="pill bad">Gấp</span>':'Thường'}</span></div>
        <div class="kvr"><span class="hint">Hạn</span><span class="num" style="${isLate(v)?'color:var(--bad);font-weight:600':''}">${fmtD(v.deadline)}</span></div>
        <div class="kvr"><span class="hint">Giá tạm tính</span><span class="num">${calcQuote(v.quote).est?vnd(calcQuote(v.quote).est)+' ₫':'—'}</span></div>
        <div class="kvr"><span class="hint">Email gần nhất</span><span>${lastMail(v)}</span></div>
        ${v.origin?`<div class="kvr"><span class="hint">Nguồn</span><span>${esc(srcName(v.origin.src))}<br><span class="hint">${esc(v.origin.booth||'')}</span></span></div>`:''}
      </div></section>
    </div>
  </div>`;
}
function lastMail(v){ const all=v.emails.flatMap(t=>t.msgs); if(!all.length) return '—'; const m=[...all].sort((a,b)=>a.date<b.date?1:-1)[0]; return `${fmtD(m.date)} · ${m.from==='me'?'gửi đi':'từ hãng'}`; }

function threadHtml(v,t){
  const last=t.msgs[t.msgs.length-1]; const open=S.openThread===t.id;

  return `<div class="thread"><button class="th-row" data-a="thread" data-id="${t.id}">
    <span class="fr" style="${t.unread?'':'font-weight:500'}">${esc(names)} <span class="hint num">(${t.msgs.length})</span></span>
    <span class="sj"><span class="lbl">${esc(v.label)}</span><span style="${t.unread?'font-weight:600':''}">${esc(t.subject)}</span> <em>– ${esc(last.body.replace(/\n/g,' ').slice(0,90))}</em></span>
    <span class="dt num">${t.msgs.some(m=>m.attachments.length)?'📎 ':''}${fmtD(last.date)}</span></button>
    ${open?`<div class="msgs">${t.msgs.map(m=>`<div class="msg"><div class="h"><b>${esc(m.fromName)}</b><span class="ad">${m.from==='me'?esc(addrOf(m.fromName)):esc(m.from)}</span><span class="dt num">${fmtD(m.date)}</span></div><p>${esc(m.body)}</p>

      <div><a class="btn sm" href="https://mail.google.com/" target="_blank" rel="noopener">Mở trong Gmail ${ic('arrow')}</a></div></div>`:''}</div>`;
}

/* --- Báo giá & giá tạm tính --- */
function calcQuote(q){
  const ex = q.lines.reduce((a,l)=>a+(+l.qty||0)*(+l.price||0),0);
  const est = q.lines.reduce((a,l)=>a+(+l.qty||0)*(+l.est||0),0);
  return {ex, conv:ex*(+q.fx||0), est, missing:q.lines.filter(l=>!(+l.est)).length};
}

  const v=byId(S.openId); const c=S.compose;
  return `<div class="modal"><div class="mbox"><div class="m-h">Soạn email qua Gmail</div><div class="m-b">
    <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="hint" style="align-self:center">Mẫu:</span>${Object.keys(TEMPLATES).map(k=>`<button class="btn sm ${c.tpl===k?'pri':''}" data-a="tpl" data-v="${k}">${k}</button>`).join('')}</div>
    <div class="fl"><label>Từ</label><input class="field" value="${esc(addrOfKey(ME))}" disabled></div>
    <div class="fl"><label>Đến</label><input class="field" id="c_to" value="${esc(c.to)}"></div>
    <div class="fl"><label>CC</label><input class="field" id="c_cc" value="${esc(c.cc)}"></div>
    <div class="fl"><label>Tiêu đề</label><input class="field" id="c_sub" value="${esc(c.sub)}"></div>
    <div class="fl"><label>Nội dung</label><textarea class="field" id="c_body" style="min-height:200px">${esc(c.body)}</textarea></div>
    <div class="hint">Gửi từ hộp thư @${MAIL_DOMAIN} của bạn, CC người phụ trách các phòng, tự gắn nhãn <span class="lbl">${esc(v.label)}</span> và lưu vào lịch sử hãng. Bản prototype chỉ mô phỏng, không gửi thật.</div>
  </div><div class="m-f"><button class="btn" data-a="closeModal">Thoát</button><button class="btn pri" data-a="sendMail">${ic('send')} Gửi</button></div></div></div>`;
}

/* ======================= Hành động ======================= */
let toastT;
function toast(m){ const t=document.getElementById('toast'); t.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>{t.innerHTML='';},2800); }
function readForm(v){
  const g=id=>document.getElementById(id);
  v.website=g('f_website').value.trim(); v.group=g('f_group').value; v.name=g('f_name').value.trim(); v.mang=g('f_mang').value; v.country=g('f_country').value;
  v.contact.name=g('f_cname').value.trim(); v.note=g('f_note').value; v.desc=g('f_desc').value; v.project=g('f_project').value.trim(); v.priority=g('f_prio').value; v.deadline=g('f_deadline').value;
  v.contact.title=g('f_ctitle').value.trim(); v.contact.email=g('f_cemail').value.trim(); v.contact.phone=g('f_cphone').value.trim(); v.ndaFirst=g('f_nda').checked;
  ['KT','XNK','KD'].forEach(d=>v.owners[d]=[...document.querySelectorAll(`.f_owner[data-d="${d}"]:checked`)].map(i=>i.value));
  v.label='HÃNG/'+(v.name.split(' ')[0]||'').toUpperCase();
}
function addFiles(v,list,cat){
  const n=list.length;
  [...list].forEach(f=>{ const kb=f.size/1024; v.files.push({id:uid(),name:f.name,cat,size:kb>1024?(kb/1024).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(kb))+' KB',date:iso(TODAY),by:ME,src:'Tải lên',url:URL.createObjectURL(f)}); addLog(v,`Tải lên ${f.name} (${cat})`); });
  render(); toast(`Đã lưu ${n} file vào mục ${cat}`);
}
function bindDrop(){
  const d=document.getElementById('drop'); if(!d) return;
  d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over');});
  d.addEventListener('dragleave',()=>d.classList.remove('over'));
  d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');const v=byId(S.openId);if(e.dataTransfer.files.length) addFiles(v,e.dataTransfer.files,document.getElementById('upCat').value);});
}
function movePotentials(ids, kt, xnk, proj, prio){
  const made=[];
  ids.forEach(id=>{ const p=potById(id); if(!p||dupOf(p)) return;
    const v=V({name:p.name, website:p.website, country:p.country, mang:p.mang, stage:'contact', created:iso(TODAY), deadline:ahead(30), priority:prio, project:proj, desc:p.desc,
      origin:p.src==='manual'?null:{src:p.src, booth:p.booth}, contact:{name:'',title:'',email:p.email||'',phone:''}, owners:{KT:[kt],XNK:xnk?[xnk]:[],KD:[]},
      log:[{d:iso(TODAY),who:ME,t:`Chuyển từ Danh sách tiềm năng${p.src==='manual'?'':' ('+srcName(p.src)+')'}`}]});
    vendors.unshift(v); p.status='moved'; p.movedTo=v.id; made.push(v); S.sel.delete(id);
  });
  return made;
}
function crit(v,id){ return v.crit[id]; }

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  if(el.tagName==='SUMMARY'||el.closest('summary')&&el.dataset.a==='toast') e.preventDefault();
  const a=el.dataset.a; const v=S.openId?byId(S.openId):null;
  switch(a){
    case 'view': S.view=el.dataset.v; S.openId=null; S.openPot=null; render(); break;
    case 'mode': S.mode=el.dataset.v; render(); break;
    case 'toast': toast(el.dataset.t); break;
    case 'pstat': S.pstat=el.dataset.v; S.sel.clear(); render(); break;
    case 'psrcSet': S.psrc=el.dataset.v; S.pstat='open'; render(); break;
    case 'openPot': { const p=potById(el.dataset.id); if(p.status==='new') p.status='seen'; S.openPot=p.id; S.openId=null; S.anim=true; render(); break; }
    case 'open': S.anim=!S.openId||S.openPot; S.openPot=null; S.openId=el.dataset.id; S.tab='over'; S.openThread=null; renderLayer(); break;
    case 'close': S.openId=null; S.openPot=null; renderLayer(); break;
    case 'tab': S.tab=el.dataset.v; renderLayer(); document.querySelector('.d-body')?.scrollTo(0,0); break;
    case 'crawl': { el.disabled=true; el.innerHTML=ic('sync')+' Đang crawl…'; setTimeout(()=>{
        const src=SOURCES.find(s=>s.id==='mpasia'); src.last=iso(TODAY);
        const add=CRAWL_QUEUE.splice(0); add.forEach(p=>{p.added=iso(TODAY); potentials.unshift(p);});
        S.pstat='open'; S.psrc='all'; render(); toast(add.length?`Crawl xong: ${add.length} hãng mới từ ${src.name}, 0 trùng`:'Crawl xong: không có hãng mới'); },1100); break; }
    case 'newPot': S.modal=modalNewPot; renderLayer(); break;
    case 'createPot': { const g=id=>document.getElementById(id).value.trim(); const name=g('p_name'), web=g('p_web');
      if(!name||!web){ document.getElementById('potErr').innerHTML='<div class="note bad">Nhập tên hãng và website. Website dùng để kiểm tra trùng.</div>'; return; }
      const p=P({name, website:web, country:g('p_country'), mang:g('p_mang'), desc:g('p_desc'), src:'manual', addedBy:ME, added:iso(TODAY), status:'seen'});
      const d=dupOf(p); potentials.unshift(p); S.modal=null; S.pstat='open'; S.psrc='all'; render(); toast(d?`Đã thêm. Lưu ý: trùng domain với hồ sơ ${d.label.toLowerCase()}`:'Đã thêm vào danh sách tiềm năng'); break; }
    case 'moveOne': S.moveIds=[el.dataset.id]; S.modal=modalMove; renderLayer(); break;
    case 'moveSel': S.moveIds=[...S.sel].filter(id=>potById(id)); S.modal=modalMove; renderLayer(); break;
    case 'doMove': { const g=id=>document.getElementById(id).value; const made=movePotentials(S.moveIds,g('m_kt'),g('m_xnk'),g('m_proj').trim(),g('m_prio'));
      S.modal=null; S.openPot=null;
      if(made.length===1){ S.view='dev'; S.openId=made[0].id; S.tab='over'; S.anim=true; render(); toast('Đã tạo hồ sơ phát triển. Bắt đầu bằng email giới thiệu ở tab Email.'); }
      else { render(); toast(`Đã chuyển ${made.length} hãng sang Hãng phát triển`); } break; }
    case 'skipOne': { const p=potById(el.dataset.id); p.status='skip'; p.skipNote='Bỏ qua bởi '+USERS[ME].name; S.sel.delete(p.id); S.openPot=null; render(); toast(`Đã bỏ qua ${p.name}`); break; }
    case 'skipSel': { const n=S.sel.size; S.sel.forEach(id=>{const p=potById(id); if(p){p.status='skip'; p.skipNote='Bỏ qua bởi '+USERS[ME].name;}}); S.sel.clear(); render(); toast(`Đã bỏ qua ${n} hãng`); break; }
    case 'unskip': { const p=potById(el.dataset.id); p.status='seen'; render(); break; }
    case 'clearSel': S.sel.clear(); render(); break;
    case 'crit': { const c=crit(v,el.dataset.c); c.st=el.dataset.v; c.by=ME; c.date=iso(TODAY); addLog(v,`${CRITS.find(x=>x.id===el.dataset.c).name}: ${({ok:'Đạt',no:'Chưa đạt','?':'Chưa rõ'})[c.st]}`); render(); break; }
    case 'sub': { const c=crit(v,el.dataset.c); const s=el.dataset.v; c.subs=c.subs.includes(s)?c.subs.filter(x=>x!==s):[...c.subs,s]; c.by=ME; c.date=iso(TODAY); render(); break; }
    case 'holdForm': S.modal=modalHold; renderLayer(); break;
    case 'doHold': v.status='hold'; v.hold={reason:document.getElementById('h_reason').value,by:ME,date:iso(TODAY),comment:document.getElementById('h_note').value}; addLog(v,'Tạm dừng: '+v.hold.reason); S.modal=null; render(); break;
    case 'reopen': v.status='active'; addLog(v,'Mở lại hồ sơ'); v.hold=null; render(); break;
    case 'transfer': S.tcoop=''; S.modal=modalTransfer; renderLayer(); break;
    case 'coop': S.tcoop=el.dataset.v; document.querySelectorAll('#t_coop button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.tcoop)); break;
    case 'doTransfer': { const sign=document.getElementById('t_sign').value;
      if(!S.tcoop||!sign){ document.getElementById('trErr').innerHTML='<div class="note bad">Chọn loại hình hợp tác và nhập ngày ký.</div>'; return; }
      v.coopType=S.tcoop; v.signDate=sign; v.expireDate=document.getElementById('t_exp').value; v.schedule=document.getElementById('t_sched').value;
      v.status='done'; v.doneDate=iso(TODAY); addLog(v,`Ký ${v.coopType}, chuyển sang Quản lý thông tin NCC`);
      NCC.unshift({name:v.name,group:v.group,country:v.country,mang:v.mang,website:v.website,coop:v.coopType,owners:JSON.parse(JSON.stringify(v.owners)),fromPipe:v.id});
      S.fresh=v.name; S.modal=null; S.openId=null; S.view='ncc'; render(); break; }
    case 'saveInfo': readForm(v); if(!v.name||!v.website){toast('Tên NCC và Website là bắt buộc');return;} addLog(v,'Cập nhật thông tin hãng'); render(); toast('Đã lưu thông tin hãng'); break;
    case 'newDev': S.draft=blankVendor(); S.modal=modalNewDev; renderLayer(); break;
    case 'createDev': { const d=S.draft; readForm(d); if(!d.name||!d.website){ document.getElementById('newErr').innerHTML='<div class="note bad">Nhập Tên NCC và Website. Website dùng để tự khớp email và kiểm tra trùng.</div>'; return; }
      d.log=[{d:iso(TODAY),who:ME,t:'Thêm hãng'}]; d.lastAct=iso(TODAY); vendors.unshift(d); S.modal=null; S.openId=d.id; S.tab='over'; S.anim=true; render(); toast('Đã tạo hồ sơ hãng phát triển'); break; }
    case 'closeModal': S.modal=null; renderLayer(); break;
    case 'thread': S.openThread=S.openThread===el.dataset.id?null:el.dataset.id; { const t=v.emails.find(t=>t.id===el.dataset.id); if(t) t.unread=false; } renderLayer(); break;
    case 'saveAtt': { const t=v.emails.find(t=>t.id===el.dataset.t); const n=el.dataset.n; const cat=/quot|báo giá/i.test(n)?'Báo giá hãng':/nda/i.test(n)?'NDA':/datasheet/i.test(n)?'Datasheet':/manual|hdsd/i.test(n)?'HDSD':/catalog|brochure|portfolio/i.test(n)?'Catalog':'Khác';
      v.files.push({id:uid(),name:n,cat,size:el.dataset.sz,date:iso(TODAY),by:ME,src:'Gmail'}); addLog(v,`Lưu ${n} từ email “${t.subject}” vào Tài liệu (${cat})`); render(); toast(`Đã lưu vào Tài liệu · mục ${cat}`); break; }
    case 'sync': { el.disabled=true; el.innerHTML=ic('sync')+' Đang đồng bộ…'; setTimeout(()=>{
      const now=new Date(); S.synced[v.id]=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      if(v.contact.email && !v._synced){ v._synced=true; v.emails.push({id:uid(),subject:`RE: ${v.emails[0]?.subject||'Follow-up'}`,unread:true,msgs:[mail(v.contact.email,v.contact.name||v.contact.email,iso(TODAY),'Hi,\nJust following up on our previous email. Let us know if you need any further information.\nBest regards',[])]}); addLog(v,'Đồng bộ Gmail: 1 email mới'); render(); toast('Có 1 email mới từ hãng'); }
      else { render(); toast('Không có email mới'); } },900); break; }
    case 'compose': S.compose={tpl:'',to:v.contact.email,cc:[...new Set([...v.owners.KT,...v.owners.XNK,...v.owners.KD])].filter(k=>k!==ME).map(addrOfKey).join(', '),sub:'',body:''}; S.modal=modalCompose; renderLayer(); break;
    case 'tpl': { const [sub,body]=TEMPLATES[el.dataset.v](v); Object.assign(S.compose,{tpl:el.dataset.v,to:document.getElementById('c_to').value,cc:document.getElementById('c_cc').value,sub,body}); renderLayer(); break; }
    case 'sendMail': { const sub=document.getElementById('c_sub').value.trim(), body=document.getElementById('c_body').value, to=document.getElementById('c_to').value.trim();
      if(!to||!sub){ toast('Nhập người nhận và tiêu đề'); return; }
      v.emails.push({id:uid(),subject:sub,msgs:[mail('me',USERS[ME].name,iso(TODAY),body)]}); if(!v.contact.email) v.contact.email=to; addLog(v,`Gửi email: ${sub}`); S.modal=null; render(); toast('Đã thêm vào lịch sử (mô phỏng gửi)'); break; }
    case 'delFile': { const f=v.files.find(f=>f.id===el.dataset.id); v.files=v.files.filter(x=>x!==f); addLog(v,`Xóa tài liệu ${f.name}`); render(); break; }
    case 'addLine': v.quote.lines.push({model:'',desc:'',qty:1,price:0,est:0}); render(); break;
    case 'delLine': v.quote.lines.splice(+el.dataset.i,1); render(); break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target; const v=S.openId?byId(S.openId):null;
  if(t.id==='mine'){ S.mine=t.checked; render(); return; }
  if(t.id==='psrc'){ S.psrc=t.value; render(); return; }
  if(t.dataset.sel){ t.checked?S.sel.add(t.dataset.sel):S.sel.delete(t.dataset.sel); render(); return; }
  if(t.id==='selAll'){ potFiltered().filter(p=>!dupOf(p)&&['new','seen'].includes(p.status)).forEach(p=>t.checked?S.sel.add(p.id):S.sel.delete(p.id)); render(); return; }
  if(t.dataset.pm){ potById(t.dataset.pm).mang=t.value; return; }
  if(!v) return;
  if(t.id==='upFile'){ addFiles(v,t.files,document.getElementById('upCat').value); return; }
  if(t.id==='stageSel'){ v.stage=t.value; addLog(v,'Đổi giai đoạn: '+STAGES[SIDX[t.value]].name); render(); return; }
  if(t.dataset.cn){ const c=v.crit[t.dataset.cn]; c.note=t.value; c.by=ME; c.date=iso(TODAY); render(); return; }
  if(t.dataset.q){ v.quote[t.dataset.q]= ['currency','incoterm','note'].includes(t.dataset.q)?t.value:+t.value; render(); }
  else if(t.dataset.l!=null){ const l=v.quote.lines[+t.dataset.l]; l[t.dataset.k]=['qty','price','est'].includes(t.dataset.k)?+t.value:t.value; if(t.dataset.k==='est'){ v.quote.estBy=ME; v.quote.estDate=iso(TODAY); } render(); }
});
document.addEventListener('input',e=>{ const id=e.target.id; if(id==='q'||id==='pq'){ if(id==='q') S.q=e.target.value; else S.pq=e.target.value; const pos=e.target.selectionStart; render(); const q=document.getElementById(id); q.focus(); q.setSelectionRange(pos,pos);} });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(S.modal){S.modal=null;renderLayer();} else if(S.openId||S.openPot){S.openId=null;S.openPot=null;renderLayer();} }
  if(e.key==='Enter' && e.target.classList?.contains('card')) e.target.click();
});
// Kéo thả thẻ giữa các giai đoạn (không khóa)
let dragId=null;
document.addEventListener('dragstart',e=>{ const c=e.target.closest?.('.card'); if(!c) return; dragId=c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',dragId); });
document.addEventListener('dragend',()=>{ dragId=null; document.querySelectorAll('.dragging,.drop-on').forEach(x=>x.classList.remove('dragging','drop-on')); });
document.addEventListener('dragover',e=>{ const col=e.target.closest?.('.col[data-stage]'); if(!col||!dragId) return; e.preventDefault(); document.querySelectorAll('.drop-on').forEach(x=>x!==col&&x.classList.remove('drop-on')); col.classList.add('drop-on'); });
document.addEventListener('drop',e=>{ const col=e.target.closest?.('.col[data-stage]'); if(!col||!dragId) return; e.preventDefault(); const v=byId(dragId); if(v&&v.stage!==col.dataset.stage){ v.stage=col.dataset.stage; addLog(v,'Đổi giai đoạn: '+STAGES[SIDX[v.stage]].name); toast(`${v.name} → ${STAGES[SIDX[v.stage]].name}`); } dragId=null; render(); });

render();
</script>
