<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
</head>
<body style="margin:0">
<title>Phát triển hãng</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell của phần mềm nội bộ (sidebar + header trắng), vùng làm việc là pipeline Kanban/bảng, chi tiết hãng mở dạng ngăn kéo bên phải */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#f7f8fa; --line:#e3e7ee; --line-2:#d3d9e3;
  --fg:#1d2733; --muted:#66727f; --faint:#9aa4b0;
  --navy:#0e2a47; --navy-fg:#ffffff; --navy-soft:#e7edf5;
  --kt:#7c3aed; --kt-soft:#f1eafe; --xnk:#d9480f; --xnk-soft:#fff0e6; --kd:#0f8a7e; --kd-soft:#e3f6f3;
  --ok:#1f9d55; --ok-soft:#e5f6ec; --warn:#b7791f; --warn-soft:#fdf3dd; --bad:#d64545; --bad-soft:#fdeaea;
  --shadow:0 10px 40px rgba(14,42,71,.18);
  --font:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e27; --surface-2:#1c2430; --line:#26303d; --line-2:#334051;
  --fg:#e4e9ef; --muted:#9aa6b4; --faint:#6b7786;
  --navy:#4d82c4; --navy-fg:#0b1118; --navy-soft:#1d2b3d;
  --kt:#b18cff; --kt-soft:#2a2140; --xnk:#ff8f57; --xnk-soft:#3a2416; --kd:#4fd1c0; --kd-soft:#14322f;
  --ok:#4ade80; --ok-soft:#173022; --warn:#f6c453; --warn-soft:#352b14; --bad:#f87171; --bad-soft:#3a1a1a;
  --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e27; --surface-2:#1c2430; --line:#26303d; --line-2:#334051;
  --fg:#e4e9ef; --muted:#9aa6b4; --faint:#6b7786;
  --navy:#4d82c4; --navy-fg:#0b1118; --navy-soft:#1d2b3d;
  --kt:#b18cff; --kt-soft:#2a2140; --xnk:#ff8f57; --xnk-soft:#3a2416; --kd:#4fd1c0; --kd-soft:#14322f;
  --ok:#4ade80; --ok-soft:#173022; --warn:#f6c453; --warn-soft:#352b14; --bad:#f87171; --bad-soft:#3a1a1a;
  --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:flex;min-height:100%}
.side{width:216px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:15px;padding:4px 10px 14px;letter-spacing:.02em;color:var(--navy)}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav.on{background:var(--navy-soft);color:var(--navy);font-weight:600}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top h1{font-size:17px;margin:0;font-weight:600;text-wrap:balance}
.top .who{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.content{padding-block:16px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;min-width:0}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--navy-fg)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:4px 9px;font-size:12.5px}
.ico{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--navy);color:var(--navy-fg)}
.field{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:0}
.field:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft)}
textarea.field{resize:vertical;min-height:70px;width:100%}
.search{width:240px;max-width:100%}

/* Stage summary strip */
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.flow button{border:0;background:none;text-align:left;padding:10px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;position:relative}
.flow button:last-child{border-right:0}
.flow button:hover{background:var(--surface-2)}
.flow button.on{background:var(--navy-soft)}
.flow .n{font-size:22px;font-weight:600;line-height:1.1}
.flow .t{font-size:12px;color:var(--muted);line-height:1.3}
.flow .step{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:flex;gap:6px;align-items:center}

/* Department chips */
.dept{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;letter-spacing:.04em;border-radius:4px;padding:1px 6px;line-height:1.5}
.dept.KT{color:var(--kt);background:var(--kt-soft)}
.dept.XNK{color:var(--xnk);background:var(--xnk-soft)}
.dept.KD{color:var(--kd);background:var(--kd-soft)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border-radius:4px;padding:1px 7px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.pill.navy{color:var(--navy);border-color:var(--navy);background:var(--navy-soft)}

/* Avatars */
.avs{display:inline-flex}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:8.5px;font-weight:700;color:#fff;border:2px solid var(--surface);margin-left:-6px;flex:none}
.avs .av:first-child{margin-left:0}
.av.lg{width:30px;height:30px;font-size:10px;margin-left:0}

/* Kanban */
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(7,minmax(250px,1fr));gap:12px;min-width:min-content}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:200px}
.col-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.col-h .r{display:flex;align-items:center;gap:6px}
.col-h b{font-size:13px;font-weight:600}
.col-h .c{margin-left:auto;font-size:12px;color:var(--muted)}
.col-h .s{font-size:11.5px;color:var(--muted)}
.col.hold{background:transparent;border-style:dashed}
.cards{padding:10px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;text-align:left;width:100%}
.card:hover{border-color:var(--navy);box-shadow:0 2px 10px rgba(14,42,71,.08)}
.card .nm{font-weight:600;font-size:13.5px;line-height:1.3}
.card .meta{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 10px}
.card .ft{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.card .ft .r{margin-left:auto;display:flex;gap:9px;align-items:center}
.card .ft .r span{display:inline-flex;gap:3px;align-items:center}
.bar{height:4px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:3px}
.card.late{box-shadow:inset 3px 0 0 var(--bad)}
.empty-col{color:var(--faint);font-size:12px;text-align:center;padding:16px 6px}

/* Tables */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1050px}
th{font-weight:600;font-size:12.5px;text-align:left;padding:12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
tbody tr.click{cursor:pointer}
tr.fresh{background:var(--ok-soft)}
th.c,td.c{text-align:center}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,32,.38);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1040px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.d-head{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px 0;display:flex;flex-direction:column;gap:12px}
.d-title{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.d-title h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.d-title .sub{color:var(--muted);font-size:12.5px;display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:3px}
.d-title .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.stp{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--faint);border:0;background:none;text-align:left;padding:0 0 2px}
.stp i{height:5px;border-radius:3px;background:var(--line)}
.stp.done{color:var(--muted)} .stp.done i{background:var(--ok)}
.stp.cur{color:var(--fg);font-weight:600} .stp.cur i{background:var(--navy)}
.stp.fail i{background:var(--bad)}
.stp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;overflow-x:auto;margin:0 -4px}
.tab{border:0;background:none;padding:9px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.tab .b{font-size:10.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:0 6px;color:var(--muted)}
.d-body{flex:1;overflow-y:auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h3{margin:0;font-size:14px;font-weight:600}
.panel-h .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.hint{color:var(--muted);font-size:12.5px}
.note{font-size:12.5px;padding:9px 12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.note.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}

/* Checklist */
.chk{display:flex;flex-direction:column}
.chk label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk label:last-child{border-bottom:0}
.chk input{margin-top:3px;accent-color:var(--navy);width:15px;height:15px;flex:none}
.chk .done-t{color:var(--muted);text-decoration:line-through}
.chk .who{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap}
.req{display:flex;flex-wrap:wrap;gap:6px}
.gate{border:1px solid var(--line-2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.gate .r{display:flex;gap:8px;flex-wrap:wrap}

/* Form */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
.form .full{grid-column:1/-1}
.fl{display:flex;flex-direction:column;gap:6px}
.fl label{font-weight:600;font-size:13px}
.fl label .star{color:var(--bad);margin-right:3px}
.fl .field{width:100%}
.fl .field:disabled{background:var(--surface-2);color:var(--faint)}
.sec-t{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600;padding-top:4px;border-top:1px solid var(--line);margin-top:4px;padding-top:12px}
.sec-t:first-child{border-top:0;margin-top:0;padding-top:0}

/* Files */
.drop{border:1.5px dashed var(--line-2);border-radius:8px;padding:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface-2)}
.drop.over{border-color:var(--navy);background:var(--navy-soft)}
.frow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.fic{width:34px;height:38px;border-radius:5px;display:grid;place-items:center;font-size:9.5px;font-weight:700;letter-spacing:.03em;flex:none;color:#fff}
.frow .nm{font-weight:500;word-break:break-word}
.frow .mt{font-size:12px;color:var(--muted)}
.frow .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.fgrp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600;padding-top:6px}

/* Email */
.mail-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.gdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.thread{border-bottom:1px solid var(--line)}
.thread:last-child{border-bottom:0}
.th-row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 16px;border:0;background:none;width:100%;text-align:left}
.th-row:hover{background:var(--surface-2)}
.th-row .fr{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-row .sj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-row .sj em{font-style:normal;color:var(--muted)}
.th-row .dt{font-size:12px;color:var(--muted);white-space:nowrap}
.msgs{padding:4px 16px 14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:12px 14px}
.msg .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.msg .h b{font-weight:600}
.msg .h .ad{color:var(--muted);font-size:12px}
.msg .h .dt{margin-left:auto;color:var(--muted);font-size:12px}
.msg p{margin:0 0 6px;white-space:pre-wrap}
.att{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line-2);border-radius:6px;padding:5px 8px;font-size:12px;margin:4px 6px 0 0}
.lbl{font-size:10.5px;border-radius:3px;padding:0 5px;background:var(--navy-soft);color:var(--navy);font-weight:600;margin-right:6px}

/* Cost calc */
.ql{min-width:640px}
.ql td,.ql th{padding:7px 8px}
.ql input{width:100%;border:1px solid var(--line);border-radius:5px;padding:5px 7px;background:var(--surface)}
.ql input.r{text-align:right}
.calc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kv{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:7px}
.kv span{font-size:11.5px;color:var(--muted)}
.kv b{font-size:16px;font-weight:600}
.kv.hl{background:var(--navy-soft);border-color:transparent}
.kv.hl b{color:var(--navy)}
.inl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

/* Timeline */
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:92px 14px minmax(0,1fr);gap:10px;padding:7px 0}
.tl-i .d{font-size:12px;color:var(--muted);text-align:right}
.tl-i .dot{width:9px;height:9px;border-radius:50%;background:var(--line-2);margin-top:6px;justify-self:center}
.tl-i .dot.KT{background:var(--kt)} .tl-i .dot.XNK{background:var(--xnk)} .tl-i .dot.KD{background:var(--kd)}

/* Modal */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(10,20,32,.45)}
.mbox{background:var(--surface);border-radius:10px;width:min(900px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
.mbox.sm{width:min(520px,100%)}
.m-h{background:var(--line);text-align:center;font-weight:600;letter-spacing:.04em;padding:13px 16px;font-size:14px;text-transform:uppercase}
.m-b{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.m-f{display:flex;justify-content:center;gap:14px;padding:14px 20px;border-top:1px solid var(--line)}
.m-f .btn{min-width:160px;justify-content:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:7px;z-index:40;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.proto{font-size:11px;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 6px;font-weight:600}

@media (max-width:1100px){.flow{grid-template-columns:repeat(3,minmax(0,1fr))}.flow button:nth-child(3){border-right:0}.flow button:nth-child(-n+3){border-bottom:1px solid var(--line)}.grid2{grid-template-columns:minmax(0,1fr)}.calc,.inl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .side{display:none}
  .form{grid-template-columns:minmax(0,1fr)}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow button{border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)}
  .stepper span{display:none}
  .th-row{grid-template-columns:minmax(0,1fr) auto}.th-row .fr{grid-column:1/-1}
  .d-head,.d-body{padding-left:16px;padding-right:16px}
  .top .who span{display:none}
  .mobile-nav{display:flex!important}
}
.mobile-nav{display:none}

function advanceBlockers(v){
  const s=STAGES[SIDX[v.stage]]; const b=[];
  const left=s.tasks.length-stageTasksDone(v,v.stage); if(left) b.push(`Còn ${left} việc chưa hoàn thành`);
  const md=missingDocs(v,v.stage); if(md.length) b.push('Thiếu tài liệu: '+md.join(', '));
  if(s.gate && v.gates[s.id]?.result!=='OK') b.push(`Cần ${DEPTS[s.dept]} duyệt OK`);
  if(s.id==='s6'){ if(v.coopType==='Chưa xác định') b.push('Chưa chọn loại hình hợp tác'); if(!v.signDate) b.push('Chưa nhập ngày ký hợp tác'); }
  return b;
}
function tabFlow(v){

  return `
  ${v.status==='hold'?`<div class="note bad"><b>Tạm dừng tại bước ${cur+1} · ${esc(v.hold.reason)}</b><br>${esc(v.hold.comment||'')} <span style="opacity:.8">(${USERS[v.hold.by]?.name}, ${fmtD(v.hold.date)})</span></div>`:''}

        <div class="chk">${s.tasks.map((t,j)=>{const on=v.tasks[s.id][j];return `<label><input type="checkbox" data-a="task" data-s="${s.id}" data-j="${j}" ${on?'checked':''} ${v.status!=='active'?'disabled':''}><span class="${on?'done-t':''}">${t}</span><span class="who">${(v.owners[s.dept]||[]).map(k=>k).join(', ')}</span></label>`;}).join('')}</div>

        ${s.gate?gateBox(v,s,g):''}
        ${v.status==='active'?`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px">
          ${last?`<button class="btn ok" data-a="transfer" ${blockers.length?'disabled':''}>${ic('arrow')} Hoàn tất &amp; chuyển sang Quản lý NCC</button>`:`<button class="btn pri" data-a="advance" ${blockers.length?'disabled':''}>Chuyển bước ${cur+2}: ${STAGES[cur+1].name} ${ic('arrow')}</button>`}

      </div></section>
      <section class="panel"><div class="panel-h"><h3>Tóm tắt</h3></div><div class="panel-b" style="gap:8px">
        ${kvRow('Dự án / nhu cầu',esc(v.project||'—'))}${kvRow('Mức ưu tiên',v.priority==='Gấp'?'<span class="pill bad">Gấp</span>':'Thường')}${kvRow('Hạn hoàn thành',`<span class="num" style="${isLate(v)?'color:var(--bad);font-weight:600':''}">${fmtD(v.deadline)}</span>`)}

const kvRow=(k,val)=>`<div style="display:flex;gap:12px;justify-content:space-between;align-items:baseline;font-size:13px"><span class="hint">${k}</span><span style="text-align:right">${val}</span></div>`;
function lastMail(v){ const all=v.emails.flatMap(t=>t.msgs); if(!all.length) return '—'; const m=all.sort((a,b)=>a.date<b.date?1:-1)[0]; return `${fmtD(m.date)} · ${m.from==='me'?'gửi đi':'từ hãng'}`; }
function gateBox(v,s,g){
  const canDecide = v.status==='active' && stageTasksDone(v,s.id)===s.tasks.length;
  return `<div class="gate"><div style="display:flex;gap:8px;align-items:center"><b>Kết luận ${DEPTS[s.dept]}</b>
    ${g?`<span class="pill ${g.result==='OK'?'ok':'bad'}" style="margin-left:auto">${g.result==='OK'?'OK':'Not OK'} · ${USERS[g.by]?.name}, ${fmtD(g.date)}</span>`:'<span class="pill" style="margin-left:auto">Chưa kết luận</span>'}</div>
    ${g?`<div class="hint">${esc(g.comment)}</div>`:''}
    ${v.status==='active'&&!g?`<textarea class="field" id="gateNote" placeholder="${s.id==='s4'?'Nhận xét: khả thi NK, HS code, CO/CQ, giá dự án…':'Nhận xét: nhu cầu thị trường, giá so với đối thủ…'}"></textarea>
      <div class="r"><button class="btn ok" data-a="gate" data-r="OK" ${canDecide?'':'disabled'}>${ic('check')} OK, chuyển tiếp được</button><button class="btn danger" data-a="gate" data-r="NotOK" ${canDecide?'':'disabled'}>Not OK</button></div>
      ${canDecide?'':'<div class="hint">Hoàn thành các việc ở trên trước khi kết luận.</div>'}`:''}
    ${v.status==='active'&&g?`<div><button class="btn sm ghost" data-a="gateReset">Sửa kết luận</button></div>`:''}

}

/* --- Quote & landed cost --- */
function calcQuote(q){
  const ex = q.lines.reduce((a,l)=>a+(+l.qty||0)*(+l.price||0),0);
  const cif = ex + (+q.freight||0) + (+q.insurance||0);
  const cifV = cif*(+q.fx||0);
  const duty = cifV*(+q.duty||0)/100;
  const vat = (cifV+duty)*(+q.vat||0)/100;
  const cost = cifV + duty + (+q.other||0);
  const ratio = ex? cost/(ex) : 0; // VND giá vốn trên 1 đơn vị ngoại tệ giá hãng
  const sell = cost*(1+(+q.margin||0)/100);
  return {ex,cif,cifV,duty,vat,cost,ratio,sell};
}

    <select class="field" id="q_inc" data-q="incoterm" ${ro}>${opt(['EXW','FCA','FOB','CIF','DAP'],q.incoterm)}</select></div></div>
    <div class="tbl-wrap" style="border:0;border-radius:0"><table class="ql"><thead><tr><th style="width:22%">Model</th><th>Mô tả</th><th style="width:70px">SL</th><th style="width:130px">Đơn giá (${q.currency})</th><th style="width:130px" class="c">Giá vốn / đv (₫)</th><th style="width:130px" class="c">Giá dự án / đv (₫)</th><th style="width:40px"></th></tr></thead><tbody>
    ${q.lines.map((l,i)=>`<tr><td><input data-l="${i}" data-k="model" value="${esc(l.model)}" ${ro}></td><td><input data-l="${i}" data-k="desc" value="${esc(l.desc)}" ${ro}></td><td><input class="r num" data-l="${i}" data-k="qty" type="number" min="0" value="${l.qty}" ${ro}></td><td><input class="r num" data-l="${i}" data-k="price" type="number" min="0" value="${l.price}" ${ro}></td>
      <td class="num" style="text-align:right">${vnd((+l.price||0)*c.ratio)}</td><td class="num" style="text-align:right;font-weight:600">${vnd((+l.price||0)*c.ratio*(1+(+q.margin||0)/100))}</td><td>${ro?'':`<button class="btn sm ghost" data-a="delLine" data-i="${i}" aria-label="Xóa dòng">${ic('x')}</button>`}</td></tr>`).join('')||'<tr><td colspan="7" class="hint">Chưa có dòng báo giá</td></tr>'}

    <div class="panel-b" style="padding-top:8px">${ro?'':`<div><button class="btn sm" data-a="addLine">${ic('plus')} Thêm dòng</button></div>`}</div></section>

    <div class="panel-b">
      <div class="inl">
        ${numIn('Tỷ giá (₫ / '+q.currency+')','fx',q.fx,ro)}${numIn('Cước vận chuyển ('+q.currency+')','freight',q.freight,ro)}${numIn('Bảo hiểm ('+q.currency+')','insurance',q.insurance,ro)}${numIn('Phí khác: thông quan, kiểm định, nội địa (₫)','other',q.other,ro)}
        ${numIn('Thuế NK (%)','duty',q.duty,ro)}${numIn('VAT NK (%)','vat',q.vat,ro)}${numIn('Biên lợi nhuận đề xuất (%)','margin',q.margin,ro)}

      <div class="calc">
        <div class="kv"><span>Tổng giá hãng (${q.incoterm})</span><b class="num">${money(c.ex,q.currency)}</b></div>
        <div class="kv"><span>CIF quy đổi</span><b class="num">${vnd(c.cifV)} ₫</b></div>
        <div class="kv"><span>Thuế NK · VAT NK (khấu trừ)</span><b class="num">${vnd(c.duty)} · ${vnd(c.vat)}</b></div>
        <div class="kv"><span>Giá vốn về kho</span><b class="num">${vnd(c.cost)} ₫</b></div>
        <div class="kv hl" style="grid-column:span 2"><span>Giá dự án đề xuất (chưa VAT bán ra)</span><b class="num" style="font-size:20px">${vnd(c.sell)} ₫</b></div>

const numIn=(lab,k,val,ro)=>`<div class="fl"><label style="font-weight:500;font-size:12.5px">${lab}</label><input class="field num" type="number" data-q="${k}" value="${val}" ${ro}></div>`;

function gatePill(v,sid){ const g=v.gates[sid]; return g?`<span class="pill ${g.result==='OK'?'ok':'bad'}">${g.result==='OK'?'OK':'Not OK'}</span>`:'<span class="pill">Chưa kết luận</span>'; }

function tabLog(v){
  return `<section class="panel"><div class="panel-h"><h3>Nhật ký hoạt động</h3></div><div class="panel-b"><div class="tl">
  ${[...v.log].reverse().map(l=>`<div class="tl-i"><span class="d num">${fmtD(l.d)}</span><span class="dot ${USERS[l.who]?.dept||''}"></span><span><b style="font-weight:600">${USERS[l.who]?.name||l.who}</b> · ${esc(l.t)}</span></div>`).join('')}
  </div></div></section>`;
}

/* ======================= Modals ======================= */
function blankVendor(){ return V({name:'', website:'', country:'Mỹ', mang:'A06', stage:'s1', partial:0, stageSince:iso(TODAY), created:iso(TODAY), deadline:ahead(30), project:'', contact:{name:'',title:'',email:'',phone:''}, owners:{XNK:[],KD:[],KT:[ME]}, log:[]}); }
function modalNew(){
  const v=S.draft;
  return `<div class="modal"><div class="mbox"><div class="m-h">Thêm hãng tiềm năng</div><div class="m-b">
    <div class="note">Hồ sơ bắt đầu ở <b>Bước 1 · Tìm kiếm &amp; tiếp cận</b>. Loại hình hợp tác và ngày ký được chốt ở bước 6, khi chuyển sang Quản lý NCC.</div>
    <div id="newErr"></div>${formFields(v,true)}</div>
    <div class="m-f"><button class="btn" data-a="closeModal">Thoát</button><button class="btn pri" data-a="createVendor">Lưu</button></div></div></div>`;
}
function modalHold(){
  return `<div class="modal"><div class="mbox sm"><div class="m-h">Tạm dừng hồ sơ</div><div class="m-b">
    <div class="fl"><label>Lý do</label><select class="field" id="h_reason">${opt(HOLD_REASONS,HOLD_REASONS[0])}</select></div>
    <div class="fl"><label>Ghi chú</label><textarea class="field" id="h_note" placeholder="Chi tiết để P.KT tìm phương án / hãng thay thế"></textarea></div>
  </div><div class="m-f"><button class="btn" data-a="closeModal">Thoát</button><button class="btn danger" data-a="doHold">Tạm dừng</button></div></div></div>`;
}
function modalTransfer(){
  const v=byId(S.openId);
  return `<div class="modal"><div class="mbox sm"><div class="m-h">Chuyển sang Quản lý NCC</div><div class="m-b">
    <div>Hồ sơ <b>${esc(v.name)}</b> đã ký <b>${v.coopType}</b> ngày ${fmtD(v.signDate)}. Khi chuyển:</div>
    <div class="chk" style="font-size:13px">
      <label style="cursor:default">${ic('check')} Tạo bản ghi NCC với các trường của form Tạo mới NCC</label>
      <label style="cursor:default">${ic('check')} Mang theo ${v.files.length} tài liệu, ${v.emails.length} chuỗi email, ${v.log.length} dòng nhật ký</label>
      <label style="cursor:default">${ic('check')} Giữ người phụ trách XNK / KD / KT</label>
      <label style="cursor:default">${ic('check')} Hồ sơ phát triển được lưu trữ, chỉ xem</label>
    </div></div><div class="m-f"><button class="btn" data-a="closeModal">Thoát</button><button class="btn ok" data-a="doTransfer">Xác nhận chuyển</button></div></div></div>`;
}
const TEMPLATES = {
  'Giới thiệu công ty':v=>[`Introduction – AIPT Vietnam × ${v.name}`,`Dear ${v.contact.name||'Sir/Madam'},\n\nWe are AIPT, a solution provider for security agencies in Vietnam. We are looking for partners in the ${v.mang} segment and would like to learn more about your products.\n\nBest regards,\n${USERS[ME].name}`],
  'Xin catalog / datasheet':v=>[`Request for catalog and datasheet – ${v.name}`,`Dear ${v.contact.name||'Sir/Madam'},\n\nCould you please share your latest product catalog, datasheets and user manuals (English)?\n\nBest regards,\n${USERS[ME].name}`],
  'Xin báo giá':v=>[`Request for quotation – ${v.project||v.name}`,`Dear ${v.contact.name||'Sir/Madam'},\n\nPlease quote the following configuration, ${v.quote.incoterm} price, incl. lead time and warranty. Please confirm that CO and CQ can be provided.\n\nBest regards,\n${USERS[ME].name}`],
  'Gửi NDA':v=>[`NDA – AIPT Vietnam and ${v.name}`,`Dear ${v.contact.name||'Sir/Madam'},\n\nPlease find attached our mutual NDA for review and signature.\n\nBest regards,\n${USERS[ME].name}`],
};
function modalCompose(){
  const v=byId(S.openId); const c=S.compose;
  return `<div class="modal"><div class="mbox"><div class="m-h">Soạn email qua Gmail</div><div class="m-b">
    <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="hint" style="align-self:center">Mẫu:</span>${Object.keys(TEMPLATES).map(k=>`<button class="btn sm ${c.tpl===k?'pri':''}" data-a="tpl" data-v="${k}">${k}</button>`).join('')}</div>
    <div class="fl"><label>Đến</label><input class="field" id="c_to" value="${esc(c.to)}"></div>
    <div class="fl"><label>CC</label><input class="field" id="c_cc" value="${esc(c.cc)}"></div>
    <div class="fl"><label>Tiêu đề</label><input class="field" id="c_sub" value="${esc(c.sub)}"></div>
    <div class="fl"><label>Nội dung</label><textarea class="field" id="c_body" style="min-height:200px">${esc(c.body)}</textarea></div>
    <div class="hint">Email gửi từ tài khoản Google Workspace của bạn, tự gắn nhãn <span class="lbl">${esc(v.label)}</span> và lưu vào lịch sử hãng. Bản prototype chỉ mô phỏng, không gửi thật.</div>
  </div><div class="m-f"><button class="btn" data-a="closeModal">Thoát</button><button class="btn pri" data-a="sendMail">${ic('send')} Gửi</button></div></div></div>`;
}

/* ======================= Hành động ======================= */
let toastT;
function toast(m){ const t=document.getElementById('toast'); t.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>{t.innerHTML='';},2600); }
function readForm(v){
  const g=id=>document.getElementById(id);
  v.website=g('f_website').value.trim(); v.group=g('f_group').value; v.name=g('f_name').value.trim(); v.mang=g('f_mang').value; v.country=g('f_country').value;
  if(!g('f_coop').disabled) v.coopType=g('f_coop').value;
  v.contact.name=g('f_cname').value.trim(); v.schedule=g('f_sched').value;
  if(!g('f_sign').disabled){ v.signDate=g('f_sign').value; v.expireDate=g('f_exp').value; }
  v.note=g('f_note').value; v.desc=g('f_desc').value; v.project=g('f_project').value.trim(); v.priority=g('f_prio').value; v.deadline=g('f_deadline').value;
  v.contact.title=g('f_ctitle').value.trim(); v.contact.email=g('f_cemail').value.trim(); v.contact.phone=g('f_cphone').value.trim();
  ['KT','XNK','KD'].forEach(d=>v.owners[d]=[...document.querySelectorAll(`.f_owner[data-d="${d}"]:checked`)].map(i=>i.value));
  v.label='HÃNG/'+(v.name.split(' ')[0]||'').toUpperCase();
}
function addFiles(v,list,cat){
  [...list].forEach(f=>{ const kb=f.size/1024; v.files.push({id:uid(),name:f.name,cat,size:kb>1024?(kb/1024).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(kb))+' KB',date:iso(TODAY),by:ME,src:'Tải lên',url:URL.createObjectURL(f)}); addLog(v,`Tải lên ${f.name} (${cat})`); });
  render(); toast(`Đã lưu ${list.length} file vào mục ${cat}`);
}
function bindDrop(){
  const d=document.getElementById('drop'); if(!d) return;
  d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over');});
  d.addEventListener('dragleave',()=>d.classList.remove('over'));
  d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');const v=byId(S.openId);if(e.dataTransfer.files.length) addFiles(v,e.dataTransfer.files,document.getElementById('upCat').value);});
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a; const v=S.openId?byId(S.openId):null;
  switch(a){
    case 'view': S.view=el.dataset.v; S.openId=null; render(); break;
    case 'mode': S.mode=el.dataset.v; render(); break;
    case 'stagef': S.stage=S.stage===el.dataset.v?'all':el.dataset.v; render(); break;
    case 'toast': toast(el.dataset.t); break;
    case 'open': S.anim=true; S.openId=el.dataset.id; S.tab='flow'; S.openThread=null; renderLayer(); break;
    case 'openArchived': S.anim=true; S.openId=el.dataset.id; S.tab='flow'; renderLayer(); break;
    case 'close': S.openId=null; renderLayer(); break;
    case 'tab': S.tab=el.dataset.v; renderLayer(); document.querySelector('.d-body')?.scrollTo(0,0); break;
    case 'task': { const s=el.dataset.s,j=+el.dataset.j; v.tasks[s][j]=el.checked; if(el.checked) addLog(v,`Hoàn thành: ${STAGES[SIDX[s]].tasks[j]}`); render(); break; }
    case 'gate': { const s=STAGES[SIDX[v.stage]]; const note=document.getElementById('gateNote').value.trim();
      if(el.dataset.r==='NotOK' && !note){ toast('Nhập lý do Not OK để P.KT có căn cứ tìm phương án khác'); return; }
      v.gates[s.id]={result:el.dataset.r,by:ME,date:iso(TODAY),comment:note||'OK'};
      addLog(v,`${s.name}: ${el.dataset.r==='OK'?'OK':'Not OK'}${note?' · '+note:''}`);
      if(el.dataset.r==='NotOK'){ v.status='hold'; v.hold={stage:v.stage,reason:s.id==='s4'?'Không khả thi nhập khẩu':'Giá không cạnh tranh',by:ME,date:iso(TODAY),comment:note}; toast('Đã chuyển hồ sơ sang Tạm dừng / Không đạt'); }
      render(); break; }
    case 'gateReset': delete v.gates[v.stage]; render(); break;
    case 'advance': { const cur=SIDX[v.stage]; v.stage=STAGES[cur+1].id; v.stageSince=iso(TODAY); addLog(v,`Chuyển sang bước ${cur+2}: ${STAGES[cur+1].name}`); render(); toast(`Đã chuyển sang ${STAGES[cur+1].name}. Đã báo cho ${DEPTS[STAGES[cur+1].dept]}.`); break; }
    case 'back': { const cur=SIDX[v.stage]; v.stage=STAGES[cur-1].id; v.stageSince=iso(TODAY); delete v.gates[STAGES[cur-1].id]; addLog(v,`Trả về bước ${cur}: ${STAGES[cur-1].name}`); render(); break; }
    case 'holdForm': S.modal=modalHold; renderLayer(); break;
    case 'doHold': v.status='hold'; v.hold={stage:v.stage,reason:document.getElementById('h_reason').value,by:ME,date:iso(TODAY),comment:document.getElementById('h_note').value}; addLog(v,'Tạm dừng: '+v.hold.reason); S.modal=null; render(); break;
    case 'reopen': v.status='active'; delete v.gates[v.hold.stage]; addLog(v,'Mở lại hồ sơ'); v.hold=null; v.stageSince=iso(TODAY); render(); break;
    case 'transfer': S.modal=modalTransfer; renderLayer(); break;
    case 'doTransfer': v.status='done'; v.doneDate=iso(TODAY); addLog(v,'Chuyển sang Quản lý thông tin NCC');
      NCC.unshift({name:v.name,group:v.group,country:v.country,mang:v.mang,website:v.website,coop:v.coopType,owners:JSON.parse(JSON.stringify(v.owners)),fromPipe:v.id});
      S.fresh=v.name; S.modal=null; S.openId=null; S.view='ncc'; render(); break;
    case 'saveInfo': readForm(v); if(!v.name||!v.website){toast('Tên NCC và Website là bắt buộc');return;} addLog(v,'Cập nhật thông tin hãng'); render(); toast('Đã lưu thông tin hãng'); break;
    case 'new': S.draft=blankVendor(); S.modal=modalNew; renderLayer(); break;
    case 'createVendor': { const d=S.draft; readForm(d); if(!d.name||!d.website){ document.getElementById('newErr').innerHTML='<div class="note bad">Nhập Tên NCC và Website. Website dùng để tự khớp email với hãng.</div>'; return; }
      d.log=[{d:iso(TODAY),who:ME,t:'Tạo hồ sơ hãng'}]; vendors.unshift(d); S.modal=null; S.openId=d.id; S.tab='flow'; render(); toast('Đã tạo hồ sơ hãng ở bước Tìm kiếm & tiếp cận'); break; }
    case 'closeModal': S.modal=null; renderLayer(); break;
    case 'thread': S.openThread=S.openThread===el.dataset.id?null:el.dataset.id; { const t=v.emails.find(t=>t.id===el.dataset.id); if(t) t.unread=false; } renderLayer(); break;
    case 'saveAtt': { const t=v.emails.find(t=>t.id===el.dataset.t); const n=el.dataset.n; const cat=/quot|báo giá/i.test(n)?'Báo giá hãng':/nda/i.test(n)?'NDA':/datasheet/i.test(n)?'Datasheet':/catalog|brochure|portfolio/i.test(n)?'Catalog':'Khác';
      v.files.push({id:uid(),name:n,cat,size:el.dataset.sz,date:iso(TODAY),by:ME,src:'Gmail'}); addLog(v,`Lưu ${n} từ email “${t.subject}” vào Tài liệu (${cat})`); render(); toast(`Đã lưu vào Tài liệu · mục ${cat}`); break; }
    case 'sync': { el.disabled=true; el.innerHTML=ic('sync')+' Đang đồng bộ…'; setTimeout(()=>{
      const now=new Date(); S.synced[v.id]=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      if(v.contact.email && !v._synced){ v._synced=true; v.emails.push({id:uid(),subject:`RE: ${v.emails[0]?.subject||'Follow-up'}`,unread:true,msgs:[mail(v.contact.email,v.contact.name||v.contact.email,iso(TODAY),'Hi,\nJust following up on our previous email. Let us know if you need any further information.\nBest regards',[])]}); addLog(v,'Đồng bộ Gmail: 1 email mới'); render(); toast('Có 1 email mới từ hãng'); }
      else { render(); toast('Không có email mới'); } },900); break; }
    case 'compose': S.compose={tpl:'',to:v.contact.email,cc:[...v.owners.XNK,...v.owners.KD].map(k=>k.toLowerCase()+'@aipt.vn').join(', '),sub:'',body:''}; S.modal=modalCompose; renderLayer(); break;
    case 'tpl': { const [sub,body]=TEMPLATES[el.dataset.v](v); Object.assign(S.compose,{tpl:el.dataset.v,to:document.getElementById('c_to').value,cc:document.getElementById('c_cc').value,sub,body}); renderLayer(); break; }
    case 'sendMail': { const sub=document.getElementById('c_sub').value.trim(), body=document.getElementById('c_body').value, to=document.getElementById('c_to').value.trim();
      if(!to||!sub){ toast('Nhập người nhận và tiêu đề'); return; }
      v.emails.push({id:uid(),subject:sub,unread:false,msgs:[mail('me',USERS[ME].name,iso(TODAY),body)]}); addLog(v,`Gửi email: ${sub}`); S.modal=null; render(); toast('Đã thêm vào lịch sử (mô phỏng gửi)'); break; }
    case 'delFile': { const f=v.files.find(f=>f.id===el.dataset.id); v.files=v.files.filter(x=>x!==f); addLog(v,`Xóa tài liệu ${f.name}`); render(); break; }
    case 'addLine': v.quote.lines.push({model:'',desc:'',qty:1,price:0}); render(); break;
    case 'delLine': v.quote.lines.splice(+el.dataset.i,1); render(); break;
    case 'addComp': v.market.comps.push({name:'',price:0}); render(); break;
    case 'need': v.market.need=+el.dataset.v; render(); break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target; const v=S.openId?byId(S.openId):null;
  if(t.id==='mine'){ S.mine=t.checked; render(); return; }
  if(t.id==='upFile' && v){ addFiles(v,t.files,document.getElementById('upCat').value); return; }
  if(!v) return;
  if(t.dataset.q){ v.quote[t.dataset.q]= ['currency','incoterm'].includes(t.dataset.q)?t.value:+t.value; render(); }
  else if(t.dataset.l!=null){ const l=v.quote.lines[+t.dataset.l]; l[t.dataset.k]=['qty','price'].includes(t.dataset.k)?+t.value:t.value; render(); }
  else if(t.dataset.x){ v.xnk[t.dataset.x]=t.value; }
  else if(t.dataset.m){ v.market[t.dataset.m]=+t.value; render(); }
  else if(t.dataset.c!=null){ const c=v.market.comps[+t.dataset.c]; c[t.dataset.k]=t.dataset.k==='price'?+t.value:t.value; render(); }
});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ S.q=e.target.value; const pos=e.target.selectionStart; render(); const q=document.getElementById('q'); q.focus(); q.setSelectionRange(pos,pos);} });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(S.modal){S.modal=null;renderLayer();} else if(S.openId){S.openId=null;renderLayer();} } });

render();
</script>
